<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Freelance Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: project rail on the left, workspace in the middle, planning agent docked right; drawers slide over on narrow screens. */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#16201C; --muted:#5B6863; --faint:#8A9590;
  --line:#D8DED9; --line-2:#E6EAE7;
  --accent:#0D6B59; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8;
  --ai:#4844C4; --ai-ink:#FFFFFF; --ai-soft:#E7E6FA;
  --ok:#2C7A48; --ok-soft:#DFF0E4; --warn:#9C6400; --warn-soft:#FAEED3; --crit:#B4372F; --crit-soft:#F7E0DD;
  --shadow:0 1px 2px rgba(16,28,24,.06),0 8px 28px rgba(16,28,24,.10);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-w:236px; --ai-w:384px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E3EAE6; --muted:#9BA8A2; --faint:#6C7973;
  --line:#2A3531; --line-2:#212B28;
  --accent:#43B79C; --accent-ink:#04201A; --accent-soft:#163630;
  --ai:#A19DFF; --ai-ink:#14123A; --ai-soft:#24234A;
  --ok:#5CC283; --ok-soft:#163223; --warn:#E2A940; --warn-soft:#382B10; --crit:#F07D73; --crit-soft:#3C1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E3EAE6; --muted:#9BA8A2; --faint:#6C7973;
  --line:#2A3531; --line-2:#212B28;
  --accent:#43B79C; --accent-ink:#04201A; --accent-soft:#163630;
  --ai:#A19DFF; --ai-ink:#14123A; --ai-soft:#24234A;
  --ok:#5CC283; --ok-soft:#163223; --warn:#E2A940; --warn-soft:#382B10; --crit:#F07D73; --crit-soft:#3C1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.app.ai-on{grid-template-columns:var(--side-w) minmax(0,1fr) var(--ai-w)}

/* side rail */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-block:16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.nav-btn,.pitem{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left;color:var(--ink)}
.nav-btn:hover,.pitem:hover{background:var(--surface-2)}
.nav-btn.on,.pitem.on{background:var(--accent-soft);color:var(--ink)}
.nav-btn svg{width:16px;height:16px;color:var(--muted);flex:none}
.side-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted);display:grid;gap:8px}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.local i{background:var(--warn)}

/* main */
.main{min-width:0;min-height:0;overflow:auto;padding-block:18px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px}
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:26px;line-height:1.15}
.psub{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top-l{flex:1;min-width:220px}
.top-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:none;padding:6px;border-radius:7px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:8px 11px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search]{flex:1 1 180px;min-width:0}
.field,.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:13px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.timer-bar{display:flex;align-items:center;gap:10px;background:var(--ai-soft);border:1px solid color-mix(in srgb,var(--ai) 30%,transparent);border-radius:9px;padding:6px 10px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.timer-bar b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* chips */
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ai{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.chip.mono{font-family:var(--f-mono)}
.flag{font-size:11px;font-weight:600;font-family:var(--f-mono);padding:2px 5px;border-radius:4px}
.flag.high{background:var(--crit-soft);color:var(--crit)}
.flag.medium{background:var(--warn-soft);color:var(--warn)}
.flag.low{background:var(--surface-2);color:var(--muted)}
.av{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:600;display:inline-grid;place-items:center;flex:none;border:2px solid var(--surface)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px}
.tid{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.s-backlog{background:var(--surface-2);color:var(--faint)}
.pill.s-todo{background:var(--surface-2);color:var(--muted)}
.pill.s-doing{background:var(--ai-soft);color:var(--ai)}
.pill.s-review{background:var(--warn-soft);color:var(--warn)}
.pill.s-done{background:var(--ok-soft);color:var(--ok)}

/* list view */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.tlist-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.tlist-h h3{font-size:15px;flex:1;min-width:0}
.tlist-h .meter{width:90px}
.caret{border:0;background:none;color:var(--muted);padding:2px;transition:transform .15s}
.caret.closed{transform:rotate(-90deg)}
.row{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.is-child{padding-left:40px}
.row.is-done .rtitle{color:var(--faint);text-decoration:line-through}
.rtitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{justify-content:flex-end}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);background:none;padding:0;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.add-row{display:flex;gap:8px;padding:8px 12px}
.add-row input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:7px;padding:6px 9px}
.drop-hot{outline:2px dashed var(--accent);outline-offset:-2px}
.meter{height:6px;background:var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter.warn>i{background:var(--warn)}.meter.crit>i{background:var(--crit)}

/* table */
.tbl-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.grid td{border-bottom:1px solid var(--line-2);padding:3px 4px;vertical-align:middle;white-space:nowrap}
.grid td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-right:8px}
.grid input,.grid select{border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 5px;width:100%;min-width:0}
.grid input:hover,.grid select:hover{border-color:var(--line)}
.grid input:focus,.grid select:focus{border-color:var(--accent);background:var(--surface);outline:0}
.grid input.w-t{min-width:220px}.grid input.w-n{width:56px}.grid input.w-d{width:128px}.grid input.w-s{min-width:110px}
.grid tfoot td{font-weight:600;background:var(--surface-2)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;display:flex;flex-direction:column;min-height:120px}
.col-h{display:flex;gap:8px;align-items:center;padding:10px 12px;font-weight:600}
.col-h .sum{margin-left:auto;font-size:11.5px;color:var(--faint);font-family:var(--f-mono);font-weight:400}
.col-body{display:grid;gap:8px;padding:0 8px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:7px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.card.crit-path{box-shadow:inset 3px 0 0 var(--crit)}
.card-top{display:flex;gap:6px;align-items:center}
.card-top .avs{margin-left:auto}
.card-title{font-weight:500;line-height:1.3}

/* gantt */
.gantt{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;max-height:calc(100vh - 230px)}
.g-inner{position:relative}
.g-row{display:grid;height:32px;border-bottom:1px solid var(--line-2)}
.g-row.g-group{background:var(--surface-2);font-weight:600;font-size:12.5px}
.g-label{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;font-size:12.5px;cursor:pointer}
.g-group .g-label{background:var(--surface-2);cursor:default}
.g-track{position:relative}
.g-head{position:sticky;top:0;z-index:3;background:var(--surface);height:44px;border-bottom:1px solid var(--line)}
.g-head .g-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.g-day{position:absolute;top:0;bottom:0;font-size:10px;color:var(--faint);text-align:center;padding-top:22px;font-family:var(--f-mono)}
.g-month{position:absolute;top:4px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.g-bar{position:absolute;top:6px;height:20px;border-radius:5px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);overflow:hidden;font-size:10.5px;font-family:var(--f-mono);display:flex;align-items:center;padding:0 5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.g-bar>i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.g-bar>span{position:relative}
.g-bar.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.g-bar.crit{border:1.5px solid var(--crit)}
.g-ms{position:absolute;top:9px;width:14px;height:14px;background:var(--ai);transform:rotate(45deg);border-radius:2px}
.g-ms.done{background:var(--ok)}
.g-svg{position:absolute;pointer-events:none;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{font-size:18px;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-dow{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:6px 8px}
.cal-cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.today .cal-n{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.cal-n{font-size:12px;font-family:var(--f-mono);color:var(--muted);align-self:flex-start}
.cal-item{font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--accent-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;text-align:left;width:100%}
.cal-item.ms{background:var(--ai-soft);color:var(--ai);font-weight:600}
.cal-item.late{background:var(--crit-soft);color:var(--crit)}
.cal-item.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}

/* panels & overview */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:15px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.panel h2 .btn{margin-left:auto}
.lines{display:grid}
.line{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);min-width:0}
.line:last-child{border-bottom:0}
.line .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line.click{cursor:pointer}
.line.click:hover .grow{color:var(--accent)}
.empty-note{color:var(--muted);font-size:13px;padding:6px 0}
.health{font-weight:600}.health.ok{color:var(--ok)}.health.warn{color:var(--warn)}.health.crit{color:var(--crit)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .arrow{color:var(--faint)}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,130px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-row .meter{height:10px}
.feed{display:grid;gap:6px;font-size:12.5px}
.feed time{color:var(--faint);font-family:var(--f-mono);font-size:11px;margin-right:6px}

/* workload */
.wl{overflow-x:auto}
.wl table{border-collapse:separate;border-spacing:4px;font-size:12.5px}
.wl td,.wl th{padding:6px 8px;text-align:center;border-radius:6px;white-space:nowrap}
.wl th{color:var(--muted);font-weight:500;font-size:11.5px}
.wl td.who{text-align:left;font-weight:500}
.wl td.h{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:74px}
.wl td.lv0{background:var(--surface-2);color:var(--faint)}
.wl td.lv1{background:var(--ok-soft);color:var(--ok)}
.wl td.lv2{background:var(--warn-soft);color:var(--warn)}
.wl td.lv3{background:var(--crit-soft);color:var(--crit)}

/* portfolio */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin-bottom:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--faint)}
.pcard h3{font-size:16px;display:flex;gap:8px;align-items:center}
.pcard .row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}

/* forms */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form input,.form select,.form textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13.5px;color:var(--ink);width:100%;min-width:0}
.form textarea{resize:vertical;min-height:80px;line-height:1.5}
.form input:focus,.form select:focus,.form textarea:focus,.inp:focus{outline:0;border-color:var(--accent)}

/* ============ planning math ============ */
function pert(t){
  const e=t.est||{};let o=num(e.o),m=num(e.m),p=num(e.p);
  if(!o&&!m&&!p)return{E:0,sd:0,has:false,o:0,m:0,p:0};
  if(!m)m=(o&&p)?(o+p)/2:(o||p);if(!o)o=m;if(!p)p=m;
  return{E:(o+4*m+p)/6,sd:Math.max(0,(p-o)/6),has:true,o,m,p};
}
const isDone=t=>t.status==='done';
function loggedMap(p){const m={};for(const e of p.time)m[e.task]=(m[e.task]||0)+num(e.hours);return m}
function blockedBy(p,t){return(t.deps||[]).map(id=>p.tasks.find(x=>x.id===id)).filter(d=>d&&!isDone(d))}
function schedule(p){
  const base=p.start||today(),byId={},out={},st={},order=[],cyc=new Set(),hpd=num(p.hoursPerDay,6)||6;
  p.tasks.forEach(t=>byId[t.id]=t);
  const visit=t=>{if(st[t.id]===2)return;if(st[t.id]===1){cyc.add(t.id);return}st[t.id]=1;for(const d of t.deps||[])if(byId[d])visit(byId[d]);st[t.id]=2;order.push(t)};
  p.tasks.forEach(visit);
  for(const t of order){
    const E=pert(t).E;
    let dur=(isISO(t.start)&&isISO(t.due))?Math.max(1,dIdx(t.due,base)-dIdx(t.start,base)+1):Math.max(1,Math.ceil(E/hpd)||1);
    let es=0;for(const d of t.deps||[])if(out[d])es=Math.max(es,out[d].ef);
    if(isISO(t.start))es=dIdx(t.start,base);
    else if(isISO(t.due)&&!(t.deps||[]).length)es=dIdx(t.due,base)-dur+1;
    out[t.id]={es,ef:es+dur,dur};
  }
  const vals=Object.values(out);const end=vals.length?Math.max(...vals.map(o=>o.ef)):0;
  const succ={};p.tasks.forEach(t=>(t.deps||[]).forEach(d=>{(succ[d]=succ[d]||[]).push(t.id)}));
  for(const t of[...order].reverse()){const o=out[t.id];let lf=end;for(const s of succ[t.id]||[])if(out[s]&&out[s].ls!=null)lf=Math.min(lf,out[s].ls);o.lf=lf;o.ls=lf-o.dur;o.slack=o.ls-o.es;o.crit=o.slack<=0&&!isDone(t)}
  return{base,end,map:out,cycles:cyc};
}
function stats(p){
  const lg=loggedMap(p);let E=0,V=0,remE=0,remV=0,done=0,logged=0,billable=0;
  for(const t of p.tasks){const k=pert(t);E+=k.E;V+=k.sd*k.sd;if(isDone(t))done++;else{remE+=Math.max(0,k.E-(lg[t.id]||0));remV+=k.sd*k.sd}}
  for(const e of p.time){logged+=num(e.hours);if(e.billable!==false)billable+=num(e.hours)}
  const sd=Math.sqrt(remV),hpd=num(p.hoursPerDay,6)||6;
  const p50=remE,p90=remE+1.2816*sd;
  const daysLeft=isISO(p.deadline)?dIdx(p.deadline,today()):null;
  let health='ok',hl='On track';
  if(daysLeft!=null){const need50=p50/hpd,need90=p90/hpd;if(need50>Math.max(daysLeft,0)){health='crit';hl='At risk'}else if(need90>daysLeft){health='warn';hl='Tight'}}
  const overdue=p.tasks.filter(t=>!isDone(t)&&isISO(t.due)&&t.due<today()).length;
  return{E,sdAll:Math.sqrt(V),remE,sd,p50,p90,done,total:p.tasks.length,logged,billable,daysLeft,health,hl,overdue,hpd,lg};
}
function matches(p,t){
  const f=S.filter;
  if(!f.done&&isDone(t)&&S.view!=='board')return false;
  if(f.q){const q=f.q.toLowerCase();if(!(t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||(t.tags||[]).some(x=>x.toLowerCase().includes(q))||(t.notes||'').toLowerCase().includes(q)))return false}
  if(f.who&&!(t.assignees||[]).includes(f.who))return false;
  if(f.tag&&!(t.tags||[]).includes(f.tag))return false;
  if(f.pri&&t.priority!==f.pri)return false;
  if(f.due){const d=t.due,td=today();
    if(f.due==='overdue'&&!(isISO(d)&&d<td&&!isDone(t)))return false;
    if(f.due==='today'&&d!==td)return false;
    if(f.due==='week'&&!(isISO(d)&&d>=td&&d<=addDays(td,7)))return false;
    if(f.due==='none'&&isISO(d))return false}
  return true;
}

const byOrder=(a,b)=>(priRank[a.priority]??3)-(priRank[b.priority]??3)||num(a.id.slice(2))-num(b.id.slice(2));

function newTask(p,data={}){
  const t={id:'T-'+(++p.seq),title:'Untitled task',list:p.lists[0].id,status:'todo',priority:'none',assignees:['me'],tags:[],start:'',due:'',
    est:{o:'',m:'',p:''},progress:0,deps:[],milestone:'',parent:'',risk:'low',criteria:[],comments:[],notes:'',billable:true,private:false,recur:'none',request:'',custom:{},created:today()};

}
function setStatus(p,t,s){
  if(t.status===s)return;const was=t.status;t.status=s;
  if(s==='done'){t.progress=100;t.completed=today();logAct(p,`Completed ${t.id} ${t.title}`);
    if(t.recur&&t.recur!=='none'){
      const shift=iso=>{if(!isISO(iso))return '';if(t.recur==='daily')return addDays(iso,1);if(t.recur==='weekly')return addDays(iso,7);const d=new Date(toMs(iso));d.setUTCMonth(d.getUTCMonth()+1);return d.toISOString().slice(0,10)};
      const n=newTask(p,{...clone(t),id:undefined,status:'todo',progress:0,completed:'',comments:[],start:shift(t.start),due:shift(t.due)||shift(today())});
      n.id='T-'+p.seq;logAct(p,`Created next ${t.recur} occurrence ${n.id}`);
    }}
  else if(was==='done'){t.completed='';if(t.progress===100)t.progress=0}
}
function deleteTask(p,id){
  p.tasks=p.tasks.filter(t=>t.id!==id);
  p.tasks.forEach(t=>{t.deps=(t.deps||[]).filter(d=>d!==id);if(t.parent===id)t.parent=''});
  p.time=p.time.filter(e=>e.task!==id||e.invoiced);
}

    hoursPerDay:num(form.hoursPerDay,6),stack:form.stack||'',brief:form.brief||'',lists:tpl.lists.map(n=>({id:uid(),name:n})),tasks:[],created:today()});
  const ids=[];

function chips(p,t,lg,sch){
  const L=p.layers,c=[],td=today();
  if(L.dates){
    if(isISO(t.due)){const late=t.due<td&&!isDone(t);c.push(`<span class="chip ${late?'crit':t.due===td?'warn':''}">${isISO(t.start)?fmtD(t.start)+' – ':''}${fmtD(t.due)}</span>`)}
    const ms=p.milestones.find(m=>m.id===t.milestone);if(ms)c.push(`<span class="chip ai">◆ ${esc(ms.title)}</span>`);
    if(t.recur&&t.recur!=='none')c.push(`<span class="chip">↻ ${t.recur}</span>`);
  }
  if(L.estimate){const k=pert(t),l=lg[t.id]||0;if(k.has||l)c.push(`<span class="chip mono ${l>k.E&&k.has?'warn':''}" title="Logged / expected (PERT)">${r1(l)}/${r1(k.E)}h</span>`)}
  if(L.progress&&t.progress)c.push(`<span class="chip mono">${t.progress}%</span>`);
  if(L.tags)for(const g of t.tags||[])c.push(`<span class="chip tag">${esc(g)}</span>`);
  if(L.deps){const b=blockedBy(p,t);if(b.length)c.push(`<span class="chip crit" title="Waiting on ${b.map(x=>x.id).join(', ')}">blocked by ${b.map(x=>x.id).join(', ')}</span>`);else if((t.deps||[]).length)c.push(`<span class="chip">after ${t.deps.join(', ')}</span>`);
    if(sch&&sch.map[t.id]&&sch.map[t.id].crit)c.push('<span class="chip crit">critical path</span>')}
  if(L.risk&&t.risk&&t.risk!=='low')c.push(`<span class="chip ${t.risk==='high'?'crit':'warn'}">${t.risk==='high'?'high risk':'med risk'}</span>`);
  if(L.billing&&t.billable!==false){const k=pert(t);if(k.has)c.push(`<span class="chip mono">${money(k.E*num(p.rate),p.currency)}</span>`)}
  if(L.criteria){const cr=t.criteria||[];if(cr.length)c.push(`<span class="chip">AC ${cr.filter(x=>x.done).length}/${cr.length}</span>`);const kids=p.tasks.filter(x=>x.parent===t.id);if(kids.length)c.push(`<span class="chip">sub ${kids.filter(isDone).length}/${kids.length}</span>`)}
  for(const f of p.fields)if(L['f_'+f.id]&&t.custom[f.id])c.push(`<span class="chip"><b>${esc(f.name)}</b> ${esc(t.custom[f.id])}</span>`);
  if(t.private)c.push('<span class="chip">private</span>');
  return c.join('');
}
function md(s){
  const lines=esc(s).split('\n');let html='',inList=false;
  const inline=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of lines){const l=raw.trim();
    if(/^[-*•] /.test(l)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inline(l.slice(2))+'</li>';continue}
    if(/^\d+[.)] /.test(l)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inline(l)+'</li>';continue}
    if(inList){html+='</ul>';inList=false}
    if(l)html+='<p>'+inline(l.replace(/^#+\s*/,''))+'</p>';
  }
  if(inList)html+='</ul>';return html;
}

  ${ps.map(p=>{const d=p.tasks.filter(isDone).length;return`<button class="pitem ${S.page==='project'&&S.cur===p.id?'on':''}" data-act="open-project" data-id="${p.id}"><span class="dot" style="--c:${esc(p.color)}"></span><span class="pname">${esc(p.name)}</span><span class="pmeta">${d}/${p.tasks.length}</span></button>`}).join('')||'<div class="empty-note" style="padding:4px 8px">No projects yet</div>'}
  <div class="side-foot">
    ${tm?`<div style="display:grid;gap:6px"><span>Timer on <b class="mono">${esc(tm.task)}</b></span><div style="display:flex;gap:8px;align-items:center"><b class="mono" data-timer>${timerText()}</b><button class="btn sm" data-act="stop-timer">Stop &amp; log</button></div></div>`:''}
    <div class="sync ${S.mode==='db'?'':'local'}"><i></i>${S.mode==='db'?'Saved to your workspace':'Saved in this browser only'}</div>

}

/* ============ main ============ */
function renderMain(){
  const m=$('#main');
  if(S.page==='dashboard')m.innerHTML=dashboard();
  else if(S.page==='mywork')m.innerHTML=myWork();
  else if(S.page==='inbox')m.innerHTML=inboxView();
  else if(S.page==='contacts')m.innerHTML=contactsView();
  else if(S.page==='notes')m.innerHTML=notesView();
  else if(S.page==='library')m.innerHTML=libView();
  else if(S.page==='reports')m.innerHTML=reportsView();
  else{const p=P();m.innerHTML=p?projectPage(p):emptyState()}
  if(S.page==='project'&&S.view==='gantt')drawGanttLinks();
}
const topbar=(title,sub,right)=>`<header class="top"><button class="icon-btn menu-btn" data-act="side" aria-label="Menu">${ICON.menu}</button><div class="top-l"><h1>${title}</h1>${sub?`<div class="psub">${sub}</div>`:''}</div><div class="top-r">${right||''}<button class="btn ai" data-act="ai-toggle">${ICON.spark}Agent</button></div></header>`;
function timerBar(){const tm=S.ws.timer;if(!tm)return '';const p=S.projects[tm.pid];const t=p&&p.tasks.find(x=>x.id===tm.task);
  return`<div class="timer-bar">${ICON.clock}<span>Tracking <b>${esc(tm.task)}</b> ${t?esc(t.title):''}${p?' · '+esc(p.name):''}</span><b data-timer>${timerText()}</b><button class="btn sm" data-act="stop-timer" style="margin-left:auto">Stop &amp; log</button></div>`}

function emptyState(){
  return topbar('Workbench','')+`<div class="empty">
    <h1>Plan your first project</h1>
    <p>Pick a starting structure. Every template comes with task lists, three-point estimates and dependencies you can change. The agent can also build a plan from your brief.</p>
    <div class="tpls">${Object.entries(TEMPLATES).map(([k,v])=>`<button class="tpl" data-act="modal" data-m="new" data-tpl="${k}"><b>${esc(v.label)}</b><small>${esc(v.hint)}</small></button>`).join('')}</div>
  </div>`;
}

function projectPage(p){
  const sub=`<span class="dot" style="--c:${esc(p.color)}"></span>${esc(p.client||'No client')} · <span class="mono">${money(p.rate,p.currency)}/h</span>${isISO(p.deadline)?` · due ${fmtD(p.deadline)}`:''} <button class="btn ghost sm" data-act="modal" data-m="edit">Edit project</button>`;
  const right=`${['list','table','board','gantt'].includes(S.view)?`<div class="rel"><button class="btn" data-act="layers">${ICON.layers}Layers</button>${S.layersOpen?layersPop(p):''}</div>`:''}<button class="btn primary" data-act="new-task">${ICON.plus}Task</button>`;
  let body='';
  switch(S.view){
    case 'overview':body=overview(p);break;case 'list':body=listView(p);break;case 'table':body=tableView(p);break;
    case 'board':body=boardView(p);break;case 'gantt':body=ganttView(p);break;case 'calendar':body=calendarView(p);break;
    case 'milestones':body=milestonesView(p);break;case 'time':body=timeView(p);break;case 'billing':body=billingView(p);break;
    case 'requests':body=requestsView(p);break;case 'notes':body=notesView(p);break;
    case 'schedule':body=`<div class="panel"><h2>Schedule for ${esc(p.name)}</h2>${workload(p.id)}</div>`;break;
    case 'messages':body=messagesView(p);break;case 'links':body=linksView(p);break;default:body=listView(p);
  }
  return topbar(esc(p.name),sub,right)+timerBar()+`<nav class="tabs" role="tablist">${VIEWS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-act="view" data-v="${k}" role="tab">${l}${k==='requests'&&p.requests.filter(r=>r.status==='new').length?` <span class="chip warn">${p.requests.filter(r=>r.status==='new').length}</span>`:''}</button>`).join('')}</nav>`
    +(FILTER_VIEWS.includes(S.view)?filterBar(p):'')+body;
}
function filterBar(p){
  const f=S.filter,tags=[...new Set(p.tasks.flatMap(t=>t.tags||[]))].sort();
  return`<div class="filters">
    <input type="search" id="f-q" data-ff="q" placeholder="Search tasks, IDs, tags, notes" value="${esc(f.q)}">
    <select id="f-who" data-ff="who" aria-label="Assignee"><option value="">Anyone</option>${opts(S.ws.people.map(x=>[x.id,x.name]),f.who)}</select>
    <select id="f-tag" data-ff="tag" aria-label="Tag"><option value="">Any tag</option>${opts(tags.map(x=>[x,x]),f.tag)}</select>
    <select id="f-pri" data-ff="pri" aria-label="Priority"><option value="">Any priority</option>${opts(PRIS,f.pri)}</select>
    <select id="f-due" data-ff="due" aria-label="Due"><option value="">Any date</option>${opts([['overdue','Overdue'],['today','Due today'],['week','Next 7 days'],['none','No due date']],f.due)}</select>

function layersPop(p){

    <form data-form="add-field" style="display:flex;gap:6px"><input class="inp" id="nf-name" name="name" placeholder="Field name, e.g. Endpoint" required><select class="inp" id="nf-type" name="type" style="width:84px">${opts([['text','Text'],['number','Number'],['url','Link']],'text')}</select><button class="btn sm">Add</button></form>

/* ---- list view (task lists, subtasks) ---- */
function listView(p){
  const lg=loggedMap(p),sch=schedule(p);
  const rowsFor=(t,child)=>`<div class="row ${isDone(t)?'is-done':''} ${child?'is-child':''}" data-act="open-task" data-id="${t.id}" draggable="true" data-drag="${t.id}">
      <button class="check ${isDone(t)?'on':''}" data-act="toggle-done" data-id="${t.id}" aria-label="${isDone(t)?'Reopen':'Complete'} ${esc(t.title)}"></button>
      <span class="tid">${t.id}</span>
      <span class="rtitle">${esc(t.title)}</span>
      <span class="chips rmeta">${flag(t.priority)}${chips(p,t,lg,sch)}${p.layers.people?avs(t.assignees):''}</span></div>`;
  const sel=p.lists.some(l=>l.id===S.listSel)?S.listSel:'';
  const picker=`<div class="chips" style="margin-bottom:12px"><button class="chip ${sel?'':'tag'}" data-act="list-sel" data-id="">All lists <b class="mono">${p.tasks.length}</b></button>${p.lists.map(l=>`<button class="chip ${sel===l.id?'tag':''}" data-act="list-sel" data-id="${l.id}">${esc(l.name)} <b class="mono">${p.tasks.filter(t=>t.list===l.id).length}</b></button>`).join('')}</div>`;
  return picker+p.lists.filter(l=>!sel||l.id===sel).map(l=>{
    const all=p.tasks.filter(t=>t.list===l.id);const vis=all.filter(t=>matches(p,t));
    const tops=vis.filter(t=>!t.parent||!vis.some(x=>x.id===t.parent)).sort(byOrder);
    const d=all.filter(isDone).length,pct=all.length?Math.round(d/all.length*100):0;
    const closed=S.collapsed[l.id];
    const E=all.reduce((s,t)=>s+pert(t).E,0);
    return`<section class="tlist" data-droplist="${l.id}">
      <div class="tlist-h">
        <button class="caret ${closed?'closed':''}" data-act="collapse" data-id="${l.id}" aria-label="Toggle list">${ICON.caret}</button>
        ${S.renaming===l.id?`<form data-form="rename-list" data-id="${l.id}" style="flex:1"><input class="inp" id="rn-${l.id}" name="name" value="${esc(l.name)}" autofocus></form>`:`<h3 data-act="rename-list" data-id="${l.id}" title="Click to rename">${esc(l.name)}</h3>`}
        <span class="tid">${d}/${all.length} · ${fmtH(E)}</span>
        <span class="meter"><i style="width:${pct}%"></i></span>
        <button class="x" data-act="del-list" data-id="${l.id}" aria-label="Delete list ${esc(l.name)}" title="Delete list">×</button>
      </div>
      ${closed?'':tops.map(t=>rowsFor(t,false)+vis.filter(x=>x.parent===t.id).sort(byOrder).map(c=>rowsFor(c,true)).join('')).join('')}
      ${closed?'':`<form class="add-row" data-form="quick-task" data-list="${l.id}"><input id="qa-${l.id}" name="title" placeholder="Add a task to ${esc(l.name)} and press Enter"></form>`}
    </section>`}).join('')+`<form class="add-row" data-form="add-list" style="padding:0"><input id="new-list" name="name" placeholder="+ New task list (phase, sprint, module…)"></form>`;
}

/* ---- table view ---- */
function tableView(p){
  const lg=loggedMap(p),L=p.layers;
  const ts=p.tasks.filter(t=>matches(p,t)).sort((a,b)=>p.lists.findIndex(l=>l.id===a.list)-p.lists.findIndex(l=>l.id===b.list)||byOrder(a,b));
  const cols=[['ID'],['Task'],['List'],['Status'],['Priority'],...(L.people?[['Owner']]:[]),...(L.dates?[['Start'],['Due']]:[]),...(L.estimate?[['O'],['M'],['P'],['Expected'],['Logged']]:[]),...(L.progress?[['%']]:[]),...(L.tags?[['Tags']]:[]),...(L.deps?[['Depends on']]:[]),...(L.risk?[['Risk']]:[]),...(L.billing?[['Billable'],['Value']]:[]),...p.fields.filter(f=>L['f_'+f.id]).map(f=>[f.name])];
  let sumE=0,sumL=0,sumV=0;
  const rows=ts.map(t=>{const k=pert(t),l=lg[t.id]||0;sumE+=k.E;sumL+=l;const v=t.billable!==false?k.E*num(p.rate):0;sumV+=v;
    const i=(f,extra='',cls='')=>`<input class="${cls}" data-tf="${f}" data-id="${t.id}" id="tb-${t.id}-${f}" ${extra}>`;
    return`<tr>
    <td><button class="btn ghost sm mono" data-act="open-task" data-id="${t.id}">${t.id}</button></td>
    <td>${i('title',`value="${esc(t.title)}"`,'w-t')}</td>
    <td><select data-tf="list" data-id="${t.id}" id="tb-${t.id}-list">${opts(p.lists.map(l=>[l.id,l.name]),t.list)}</select></td>
    <td><select data-tf="status" data-id="${t.id}" id="tb-${t.id}-status">${opts(STATUSES,t.status)}</select></td>
    <td><select data-tf="priority" data-id="${t.id}" id="tb-${t.id}-pri">${opts(PRIS,t.priority)}</select></td>
    ${L.people?`<td><select data-tf="owner" data-id="${t.id}" id="tb-${t.id}-own"><option value="">Unassigned</option>${opts(S.ws.people.map(x=>[x.id,x.name]),t.assignees[0]||'')}</select></td>`:''}
    ${L.dates?`<td>${i('start',`type="date" value="${esc(t.start)}"`,'w-d')}</td><td>${i('due',`type="date" value="${esc(t.due)}"`,'w-d')}</td>`:''}
    ${L.estimate?`<td>${i('est.o',`type="number" min="0" step="0.5" value="${esc(t.est.o)}"`,'w-n')}</td><td>${i('est.m',`type="number" min="0" step="0.5" value="${esc(t.est.m)}"`,'w-n')}</td><td>${i('est.p',`type="number" min="0" step="0.5" value="${esc(t.est.p)}"`,'w-n')}</td><td class="num" data-e="${t.id}">${k.has?r1(k.E):''}</td><td class="num">${l?r1(l):''}</td>`:''}
    ${L.progress?`<td>${i('progress',`type="number" min="0" max="100" step="5" value="${num(t.progress)}"`,'w-n')}</td>`:''}
    ${L.tags?`<td>${i('tags',`value="${esc((t.tags||[]).join(', '))}" placeholder="tag, tag"`,'w-s')}</td>`:''}
    ${L.deps?`<td>${i('deps',`value="${esc((t.deps||[]).join(', '))}" placeholder="T-1, T-2"`,'w-s')}</td>`:''}
    ${L.risk?`<td><select data-tf="risk" data-id="${t.id}" id="tb-${t.id}-risk">${opts(RISKS,t.risk)}</select></td>`:''}
    ${L.billing?`<td style="text-align:center"><input type="checkbox" data-tf="billable" data-id="${t.id}" id="tb-${t.id}-bill" ${t.billable!==false?'checked':''} style="width:auto"></td><td class="num">${v?money(v,p.currency):''}</td>`:''}
    ${p.fields.filter(f=>L['f_'+f.id]).map(f=>`<td><input data-tf="custom.${f.id}" data-id="${t.id}" id="tb-${t.id}-c${f.id}" type="${f.type==='number'?'number':'text'}" value="${esc(t.custom[f.id]||'')}" class="w-s"></td>`).join('')}
  </tr>`}).join('');
  const span=5+(L.people?1:0)+(L.dates?2:0);
  return`<div class="tbl-wrap"><table class="grid"><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead>
  <tbody>${rows||`<tr><td colspan="${cols.length}" class="empty-note" style="padding:14px">No tasks match these filters.</td></tr>`}</tbody>
  ${L.estimate||L.billing?`<tfoot><tr><td colspan="${span}">${ts.length} tasks</td>${L.estimate?`<td></td><td></td><td></td><td class="num">${r1(sumE)}</td><td class="num">${r1(sumL)}</td>`:''}${L.progress?'<td></td>':''}${L.tags?'<td></td>':''}${L.deps?'<td></td>':''}${L.risk?'<td></td>':''}${L.billing?`<td></td><td class="num">${money(sumV,p.currency)}</td>`:''}${p.fields.filter(f=>L['f_'+f.id]).map(()=>'<td></td>').join('')}</tr></tfoot>`:''}
  </table></div>
  <form class="add-row" data-form="quick-task" data-list="${p.lists[0].id}" style="padding:10px 0"><input id="qa-table" name="title" placeholder="+ Add task and press Enter"></form>`;

/* ---- board ---- */
function boardView(p){
  const lg=loggedMap(p),sch=schedule(p);
  return`<div class="board">${STATUSES.map(([k,l])=>{
    const ts=p.tasks.filter(t=>t.status===k&&matches(p,t)).sort(byOrder);

    <div class="col-body">${ts.map(t=>`<article class="card ${sch.map[t.id]&&sch.map[t.id].crit&&p.layers.deps?'crit-path':''}" draggable="true" data-drag="${t.id}" data-act="open-task" data-id="${t.id}">
      <div class="card-top"><span class="tid">${t.id}</span>${flag(t.priority)}${p.layers.people?avs(t.assignees):''}</div>
      <div class="card-title">${esc(t.title)}</div>

    <form data-form="quick-task" data-status="${k}" data-list="${p.lists[0].id}"><input class="inp" id="qb-${k}" name="title" placeholder="+ Add" style="border-style:dashed;background:transparent"></form></div></div>`}).join('')}</div>`;

/* ---- gantt ---- */
const GW=26,GL=260;
function ganttView(p){
  const sch=schedule(p);const base=sch.base;
  const vis=p.tasks.filter(t=>matches(p,t));
  if(!vis.length)return`<div class="panel empty-note">No tasks to chart. Add tasks with estimates or dates and they will be scheduled from the project start (${fmtD(base)}).</div>`;
  let lo=Math.min(0,...vis.map(t=>sch.map[t.id].es),dIdx(today(),base))-2;
  let hi=Math.max(...vis.map(t=>sch.map[t.id].ef),dIdx(today(),base)+1)+4;
  for(const m of p.milestones)if(isISO(m.due)){lo=Math.min(lo,dIdx(m.due,base)-2);hi=Math.max(hi,dIdx(m.due,base)+3)}
  if(isISO(p.deadline))hi=Math.max(hi,dIdx(p.deadline,base)+3);
  const days=hi-lo,W=days*GW,x=i=>(i-lo)*GW;
  let head='';for(let i=lo;i<hi;i++){const iso=addDays(base,i),d=new Date(toMs(iso)),wd=d.getUTCDay();
    if(d.getUTCDate()===1||i===lo)head+=`<span class="g-month" style="left:${x(i)+4}px">${d.toLocaleDateString(undefined,{month:'short',year:'numeric',timeZone:'UTC'})}</span>`;
    head+=`<span class="g-day" style="left:${x(i)}px;width:${GW}px;${wd===0||wd===6?'background:var(--surface-2);':''}${iso===today()?'color:var(--accent);font-weight:700':''}">${d.getUTCDate()}</span>`}
  const rows=[];const rowOf={};
  const msRow=p.milestones.filter(m=>isISO(m.due));
  if(msRow.length)rows.push(`<div class="g-row" style="grid-template-columns:${GL}px ${W}px"><div class="g-label" style="cursor:default"><b>Milestones</b></div><div class="g-track">${msRow.map(m=>`<span class="g-ms ${m.done?'done':''}" style="left:${x(dIdx(m.due,base))+GW/2-7}px" title="${esc(m.title)} · ${fmtD(m.due)}"></span>`).join('')}</div></div>`);
  for(const l of p.lists){const ts=vis.filter(t=>t.list===l.id).sort((a,b)=>sch.map[a.id].es-sch.map[b.id].es||byOrder(a,b));if(!ts.length)continue;
    rows.push(`<div class="g-row g-group" style="grid-template-columns:${GL}px ${W}px"><div class="g-label">${esc(l.name)}</div><div class="g-track"></div></div>`);
    for(const t of ts){const s=sch.map[t.id];rowOf[t.id]=rows.length;
      rows.push(`<div class="g-row" style="grid-template-columns:${GL}px ${W}px"><div class="g-label" data-act="open-task" data-id="${t.id}"><span class="tid">${t.id}</span><span class="rtitle">${esc(t.title)}</span></div>
      <div class="g-track"><span class="g-bar ${isDone(t)?'done':''} ${s.crit&&p.layers.deps?'crit':''}" data-act="open-task" data-id="${t.id}" style="left:${x(s.es)+2}px;width:${s.dur*GW-4}px" title="${esc(t.title)} · ${fmtD(addDays(base,s.es))} – ${fmtD(addDays(base,s.ef-1))}${s.slack>0?' · slack '+s.slack+'d':''}"><i style="width:${num(t.progress)}%"></i><span>${t.id}</span></span></div></div>`)}}
  const links=[];
  if(p.layers.deps)for(const t of vis)for(const d of t.deps||[])if(rowOf[d]!=null&&rowOf[t.id]!=null){const a=sch.map[d],b=sch.map[t.id];links.push([x(a.ef)-2,rowOf[d]*32+16,x(b.es)+2,rowOf[t.id]*32+16,a.crit&&b.crit])}
  const vlines=[[dIdx(today(),base),'var(--accent)','Today'],...(isISO(p.deadline)?[[dIdx(p.deadline,base)+1,'var(--crit)','Deadline']]:[])];
  ganttView.data={links,vlines:vlines.map(([i,c,l])=>[x(i),c,l]),H:rows.length*32,W};
  return`<div class="gantt"><div class="g-inner" style="width:${GL+W}px">
    <div class="g-row g-head" style="grid-template-columns:${GL}px ${W}px"><div class="g-label">Task</div><div class="g-track">${head}</div></div>
    <div id="g-body" style="position:relative">${rows.join('')}<svg class="g-svg" id="g-svg" style="left:${GL}px;top:0" width="${W}" height="${rows.length*32}"></svg></div>
  </div></div>
  <div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 35%,var(--surface))"></i>Scheduled</span><span><i style="background:var(--ok-soft)"></i>Done</span><span><i style="border:1.5px solid var(--crit)"></i>Critical path</span><span><i style="background:var(--ai);transform:rotate(45deg);width:10px"></i>Milestone</span><span>Tasks without dates are placed after their dependencies at ${p.hoursPerDay}h/day.</span>${sch.cycles.size?`<span class="chip crit">Circular dependency: ${[...sch.cycles].join(', ')}</span>`:''}</div>`;
}
function drawGanttLinks(){
  const svg=$('#g-svg');const d=ganttView.data;if(!svg||!d)return;
  let s='<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--faint)"/></marker><marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--crit)"/></marker></defs>';
  for(const [x,c,l] of d.vlines)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${d.H}" stroke="${c}" stroke-width="1.5" stroke-dasharray="${l==='Today'?'0':'4 3'}"/><text x="${x+4}" y="12" fill="${c}" font-size="10" font-family="IBM Plex Mono,monospace">${l}</text>`;
  for(const [x1,y1,x2,y2,crit] of d.links){const mx=Math.max(x1+8,Math.min(x2-8,x1+8));const col=crit?'var(--crit)':'var(--faint)';
    s+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" fill="none" stroke="${col}" stroke-width="1.2" marker-end="url(#${crit?'arc':'ar'})"/>`}
  svg.innerHTML=s;
}

/* ---- calendar ---- */
function calendarView(p){
  const [y,m]=S.cal.split('-').map(Number);const first=`${S.cal}-01`;const start=weekStart(first);
  const label=new Date(toMs(first)).toLocaleDateString(undefined,{month:'long',year:'numeric',timeZone:'UTC'});
  const vis=p.tasks.filter(t=>matches(p,t)&&isISO(t.due));let cells='';const td=today();
  for(let i=0;i<42;i++){const iso=addDays(start,i);const out=Number(iso.slice(5,7))!==m;
    if(i===35&&out)break;
    const items=vis.filter(t=>t.due===iso).sort(byOrder);const ms=p.milestones.filter(x=>x.due===iso);
    cells+=`<div class="cal-cell ${out?'out':''} ${iso===td?'today':''}"><span class="cal-n">${Number(iso.slice(8))}</span>
      ${ms.map(x=>`<button class="cal-item ms" data-act="view" data-v="milestones">◆ ${esc(x.title)}</button>`).join('')}
      ${items.slice(0,4).map(t=>`<button class="cal-item ${isDone(t)?'done':iso<td?'late':''}" data-act="open-task" data-id="${t.id}" title="${esc(t.title)}">${t.id} ${esc(t.title)}</button>`).join('')}
      ${items.length>4?`<span class="tid">+${items.length-4} more</span>`:''}</div>`}
  return`<div class="cal-h"><button class="btn sm" data-act="cal" data-d="-1" aria-label="Previous month">‹</button><h2>${label}</h2><button class="btn sm" data-act="cal" data-d="1" aria-label="Next month">›</button><button class="btn ghost sm" data-act="cal" data-d="0">Today</button></div>
  <div style="overflow-x:auto"><div class="cal" style="min-width:640px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div>
  <div class="legend">Tasks appear on their due date. ${p.tasks.filter(t=>!isISO(t.due)&&!isDone(t)).length} open tasks have no due date.</div>`;
}

/* ---- milestones ---- */
function milestonesView(p){
  const ms=[...p.milestones].sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  return`<div class="grid2"><div class="panel"><h2>Milestones</h2><div class="lines">${ms.map(m=>{
    const ts=p.tasks.filter(t=>t.milestone===m.id);const d=ts.filter(isDone).length;const pct=ts.length?Math.round(d/ts.length*100):0;
    const late=isISO(m.due)&&m.due<today()&&!m.done;
    return`<div class="line"><button class="check ${m.done?'on':''}" data-act="ms-done" data-id="${m.id}" aria-label="Toggle milestone"></button>
      <div class="grow"><b>${esc(m.title)}</b><div class="chips" style="margin-top:4px"><span class="chip ${late?'crit':''}">${m.due?fmtD(m.due):'No date'}</span><span class="chip mono">${d}/${ts.length} tasks</span>${m.desc?`<span class="tid">${esc(m.desc)}</span>`:''}</div></div>
      <span class="meter" style="width:70px"><i style="width:${pct}%"></i></span>
      <button class="btn ghost sm" data-act="modal" data-m="milestone" data-id="${m.id}">Edit</button></div>`}).join('')||'<div class="empty-note">No milestones yet. Add delivery points like "Beta handover" or "Payment 2 of 3" and link tasks to them.</div>'}</div></div>
  <div class="panel"><h2>Add milestone</h2><form class="form" data-form="milestone"><label>Title<input id="ms-title" name="title" required placeholder="e.g. MVP handover"></label><div class="two"><label>Due date<input id="ms-due" name="due" type="date"></label><label>Linked list<select id="ms-list" name="list"><option value="">None</option>${opts(p.lists.map(l=>[l.id,l.name]),'')}</select></label></div><label>Notes<input id="ms-desc" name="desc" placeholder="Deliverable, payment trigger…"></label><div><button class="btn primary">Add milestone</button></div></form>
  <p class="empty-note">Linking a task list attaches all of its tasks to the milestone.</p></div></div>`;
}

/* ---- time ---- */
function timeView(p){
  const lg=loggedMap(p);const entries=[...p.time].sort((a,b)=>b.date.localeCompare(a.date));
  const byPerson={};for(const e of p.time)byPerson[e.person]=(byPerson[e.person]||0)+num(e.hours);

  const wkRows=S.ws.people.map(pp=>{const hs=week.map(d=>p.time.filter(e=>e.person===pp.id&&e.date===d).reduce((s,e)=>s+num(e.hours),0));const tot=hs.reduce((a,b)=>a+b,0);return tot?`<tr><td class="who">${esc(pp.name)}</td>${hs.map(h=>`<td class="h ${h?'lv1':'lv0'}">${h?r1(h):'·'}</td>`).join('')}<td class="h"><b>${r1(tot)}</b></td></tr>`:''}).join('');
  const openTasks=p.tasks.filter(t=>!isDone(t)).sort(byOrder);
  return`<div class="grid2">
  <div class="panel"><h2>Log time</h2>
    <form class="form" data-form="log-time">
      <label>Task<select id="lt-task" name="task" required>${opts(p.tasks.map(t=>[t.id,t.id+' '+t.title]),S.focusTask||openTasks[0]?.id)}</select></label>
      <div class="three"><label>Date<input id="lt-date" name="date" type="date" value="${today()}"></label><label>Hours<input id="lt-h" name="hours" type="number" step="0.25" min="0.05" required placeholder="1.5"></label><label>Person<select id="lt-p" name="person">${opts(S.ws.people.map(x=>[x.id,x.name]),'me')}</select></label></div>
      <label>Description<input id="lt-note" name="note" placeholder="What did you do?"></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="chk"><input type="checkbox" id="lt-bill" name="billable" checked>Billable</label><button class="btn primary" style="margin-left:auto">Log time</button>
      <button type="button" class="btn" data-act="start-timer-sel">${ICON.clock}Start timer</button></div>
    </form></div>
  <div class="panel"><h2>This week</h2>${wkRows?`<div class="wl"><table><tr><th></th>${week.map(d=>`<th>${new Date(toMs(d)).toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'})} ${Number(d.slice(8))}</th>`).join('')}<th>Total</th></tr>${wkRows}</table></div>`:'<div class="empty-note">No time logged this week yet.</div>'}
    <div class="sec" style="margin:12px 0 8px">By person, all time</div>
    <div class="bars">${Object.entries(byPerson).map(([id,h])=>`<div class="bar-row"><span>${esc(person(id)?.name||id)}</span><span class="meter"><i style="width:${Math.min(100,h/Math.max(...Object.values(byPerson))*100)}%"></i></span><span class="mono">${fmtH(h)}</span></div>`).join('')||'<span class="empty-note">Nothing logged.</span>'}</div></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Time entries <span class="tid">${entries.length}</span></h2>
  <div class="tbl-wrap" style="border:0"><table class="grid"><thead><tr><th>Date</th><th>Task</th><th>Person</th><th>Description</th><th>Hours</th><th>Billable</th><th>Invoice</th><th></th></tr></thead><tbody>
  ${entries.map(e=>{const t=p.tasks.find(x=>x.id===e.task);return`<tr><td class="mono">${fmtD(e.date)}</td><td><button class="btn ghost sm" data-act="open-task" data-id="${esc(e.task)}"><span class="mono">${esc(e.task)}</span> ${esc(t?t.title.slice(0,40):'(deleted)')}</button></td><td>${esc(person(e.person)?.name||'')}</td><td>${esc(e.note||'')}</td><td class="num">${r1(num(e.hours))}</td><td style="text-align:center">${e.billable!==false?'Yes':'No'}</td><td class="mono">${esc(p.invoices.find(i=>i.id===e.invoiced)?.number||'')}</td><td>${e.invoiced?'':`<button class="x" data-act="del-time" data-id="${e.id}" aria-label="Delete entry">×</button>`}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty-note" style="padding:12px">No entries yet.</td></tr>'}
  </tbody></table></div></div>`;
}

/* ---- billing ---- */
function billingView(p){
  const st=stats(p);const rate=num(p.rate);const uninv=p.time.filter(e=>e.billable!==false&&!e.invoiced);const uh=uninv.reduce((s,e)=>s+num(e.hours),0);
  const bh=num(p.budgetHours);const burn=bh?st.logged/bh:0;const fc=st.logged+st.p50;
  return`<div class="kpis">
    <div class="kpi"><span class="k">Budget used</span><span class="v">${bh?Math.round(burn*100)+'%':'—'}</span><span class="meter ${burn>1?'crit':burn>.85?'warn':''}" style="width:100%"><i style="width:${Math.min(100,burn*100)}%"></i></span><span class="s">${fmtH(st.logged)} of ${bh?fmtH(bh):'no budget set'}</span></div>
    <div class="kpi"><span class="k">Forecast at completion</span><span class="v">${fmtH(fc)}</span><span class="s">${bh?(fc>bh?`<span class="health crit">${fmtH(fc-bh)} over budget</span>`:`<span class="health ok">${fmtH(bh-fc)} under budget</span>`):'logged + remaining P50'}</span></div>
    <div class="kpi"><span class="k">Billed value</span><span class="v">${money(p.invoices.reduce((s,i)=>s+num(i.total),0),p.currency)}</span><span class="s">${p.invoices.length} invoices · ${money(p.invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+num(i.total),0),p.currency)} paid</span></div>
    <div class="kpi"><span class="k">Ready to invoice</span><span class="v">${money(uh*rate,p.currency)}</span><span class="s">${fmtH(uh)} billable, not invoiced</span></div>
  </div>
  <div class="grid2"><div class="panel"><h2>Invoices<button class="btn primary sm" data-act="make-invoice" ${uh?'':'disabled'}>Create from ${fmtH(uh)}</button></h2>
    <div class="lines">${[...p.invoices].reverse().map(i=>`<details class="line" style="display:block"><summary style="display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none"><b class="mono">${esc(i.number)}</b><span class="grow tid">${fmtD(i.date)} · ${fmtH(num(i.hours))}</span><b class="mono">${money(i.total,p.currency)}</b>
      <select data-inv="${i.id}" id="inv-${i.id}" class="field" style="padding:2px 6px">${opts([['draft','Draft'],['sent','Sent'],['paid','Paid']],i.status)}</select></summary>
      <div style="padding:10px 0 4px;display:grid;gap:6px">${invoiceLines(p,i).map(l=>`<div style="display:flex;gap:10px;font-size:12.5px"><span class="grow">${esc(l.label)}</span><span class="mono">${fmtH(l.h)}</span><span class="mono">${money(l.h*num(i.rate||rate),p.currency)}</span></div>`).join('')}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="copy-invoice" data-id="${i.id}">Copy as text</button><button class="btn sm ai" data-act="ask" data-q="Draft a short, friendly email to send invoice ${esc(i.number)} (${money(i.total,p.currency)}) to the client, summarising the work covered.">Draft email with agent</button><button class="btn sm danger" data-act="del-invoice" data-id="${i.id}">Void</button></div></div></details>`).join('')||'<div class="empty-note">No invoices yet. Log billable time, then create an invoice from it.</div>'}</div></div>
  <div class="panel"><h2>Rates &amp; budget</h2><form class="form" data-form="budget"><div class="two"><label>Hourly rate<input id="b-rate" name="rate" type="number" min="0" step="1" value="${esc(p.rate)}"></label><label>Currency<select id="b-cur" name="currency">${opts(CURRENCIES.map(c=>[c,c]),p.currency)}</select></label></div><div class="two"><label>Budget (hours)<input id="b-h" name="budgetHours" type="number" min="0" value="${esc(p.budgetHours||'')}"></label><label>Fixed fee (optional)<input id="b-fee" name="fixedFee" type="number" min="0" value="${esc(p.fixedFee||'')}"></label></div><div><button class="btn primary">Save</button></div></form>
  ${num(p.fixedFee)?`<p class="empty-note">Effective rate on fixed fee: <b class="mono">${money(num(p.fixedFee)/Math.max(1,fc),p.currency)}/h</b> at the current forecast.</p>`:''}</div></div>`;
}
function invoiceLines(p,i){const m={};for(const e of p.time.filter(e=>e.invoiced===i.id)){const t=p.tasks.find(x=>x.id===e.task);const k=e.task;m[k]=m[k]||{label:`${e.task} ${t?t.title:''}`,h:0};m[k].h+=num(e.hours)}return Object.values(m)}

/* ---- requests ---- */
function requestsView(p){
  const rs=[...p.requests].reverse();

    <form class="form" data-form="request"><div class="two"><label>From<input id="rq-from" name="from" placeholder="Client contact" value="${esc(p.client||'')}"></label><label>Received<input id="rq-date" name="date" type="date" value="${today()}"></label></div>
    <label>Request<textarea id="rq-text" name="text" required placeholder="Paste the email or message. The agent can check it against the brief and split it into estimated tasks."></textarea></label><div><button class="btn primary">Add request</button></div></form></div>

    <div class="chips"><b class="mono">${r.id}</b><span class="chip ${pill(r.status)}">${r.status}</span>${r.impact?`<span class="chip ${r.impact==='change-order'?'crit':'ok'}">${r.impact}</span>`:''}<span class="tid">${esc(r.from||'')} · ${fmtD(r.date)}</span>
      <select class="field" data-req="${r.id}" id="rq-st-${r.id}" style="margin-left:auto;padding:3px 6px">${opts([['new','New'],['triaged','Triaged'],['converted','Converted'],['declined','Declined']],r.status)}</select></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ai sm" data-act="ask" data-q="Triage request ${r.id}: decide whether it is in scope of the brief or a change order, set its status and impact, break it into estimated tasks linked to the request, and draft a short reply to the client with the estimate and cost.">${ICON.spark}Triage with agent</button><button class="btn sm" data-act="req-task" data-id="${r.id}">Create task</button></div></div>`}).join('')||'<div class="panel empty-note">No client requests logged. Paste one above when it arrives so scope changes stay visible.</div>'}</div>`;

/* ---- overview ---- */
function overview(p){
  const st=stats(p),sch=schedule(p);const cp=p.tasks.filter(t=>sch.map[t.id]&&sch.map[t.id].crit).sort((a,b)=>sch.map[a.id].es-sch.map[b.id].es);
  const risks=p.tasks.filter(t=>!isDone(t)&&(t.risk==='high'||t.risk==='med')).sort((a,b)=>(a.risk==='high'?0:1)-(b.risk==='high'?0:1));
  const blocked=p.tasks.filter(t=>!isDone(t)&&blockedBy(p,t).length&&t.status==='doing');
  const late=p.tasks.filter(t=>!isDone(t)&&isISO(t.due)&&t.due<today());
  const noEst=p.tasks.filter(t=>!isDone(t)&&!pert(t).has);
  const nextMs=p.milestones.filter(m=>!m.done&&isISO(m.due)).sort((a,b)=>a.due.localeCompare(b.due))[0];
  const byList=p.lists.map(l=>{const ts=p.tasks.filter(t=>t.list===l.id);return{n:l.name,E:ts.reduce((s,t)=>s+pert(t).E,0),L:ts.reduce((s,t)=>s+(st.lg[t.id]||0),0)}});
  const maxE=Math.max(1,...byList.map(b=>Math.max(b.E,b.L)));
  const line=t=>`<div class="line click" data-act="open-task" data-id="${t.id}"><span class="tid">${t.id}</span><span class="grow">${esc(t.title)}</span>${flag(t.priority)}</div>`;
  return`<div class="kpis">
    <div class="kpi"><span class="k">Schedule health</span><span class="v health ${st.health}">${st.daysLeft==null?'No deadline':st.hl}</span><span class="s">${st.daysLeft==null?'Set a deadline to forecast':`${st.daysLeft} days left · needs ${r1(st.p50/st.hpd)}–${r1(st.p90/st.hpd)} working days`}</span></div>
    <div class="kpi"><span class="k">Remaining effort</span><span class="v">${fmtH(st.p50)}</span><span class="s">P90 ${fmtH(st.p90)} · σ ${r1(st.sd)}h (PERT)</span></div>
    <div class="kpi"><span class="k">Progress</span><span class="v">${st.total?Math.round(st.done/st.total*100):0}%</span><span class="meter" style="width:100%"><i style="width:${st.total?st.done/st.total*100:0}%"></i></span><span class="s">${st.done} of ${st.total} tasks done</span></div>
    <div class="kpi"><span class="k">Projected value</span><span class="v">${money((st.logged+st.p50)*num(p.rate),p.currency)}</span><span class="s">${fmtH(st.logged)} logged · ${money(st.billable*num(p.rate),p.currency)} billable so far</span></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Critical path<span class="tid">${fmtH(cp.reduce((s,t)=>s+pert(t).E,0))}</span></h2>${cp.length?`<div class="chain">${cp.map((t,i)=>`${i?'<span class="arrow">→</span>':''}<button class="chip mono crit" data-act="open-task" data-id="${t.id}" title="${esc(t.title)}">${t.id}</button>`).join('')}</div><p class="empty-note">Any delay on these tasks moves the end date. Finish ${sch.end} days after start at ${p.hoursPerDay}h/day.</p>`:'<div class="empty-note">Add dependencies and estimates to see the chain that sets your end date.</div>'}</div>
    <div class="panel"><h2>Needs attention</h2><div class="lines">
      ${late.map(t=>`<div class="line click" data-act="open-task" data-id="${t.id}"><span class="chip crit">overdue</span><span class="grow">${t.id} ${esc(t.title)}</span><span class="tid">${fmtD(t.due)}</span></div>`).join('')}
      ${blocked.map(t=>`<div class="line click" data-act="open-task" data-id="${t.id}"><span class="chip crit">blocked</span><span class="grow">${t.id} ${esc(t.title)}</span></div>`).join('')}
      ${noEst.length?`<div class="line"><span class="chip warn">no estimate</span><span class="grow">${noEst.length} open tasks</span><button class="btn ai sm" data-act="ask" data-q="Add three-point estimates (o, m, p in hours) to every open task that has none, with one-line reasoning in the notes.">Estimate</button></div>`:''}
      ${p.requests.filter(r=>r.status==='new').map(r=>`<div class="line click" data-act="view" data-v="requests"><span class="chip warn">request</span><span class="grow">${r.id} ${esc(r.text.slice(0,60))}</span></div>`).join('')}
      ${!late.length&&!blocked.length&&!noEst.length&&!p.requests.some(r=>r.status==='new')?'<div class="empty-note">Nothing urgent. Good place to be.</div>':''}</div></div>
    <div class="panel"><h2>Risks</h2><div class="lines">${risks.slice(0,6).map(line).join('')||'<div class="empty-note">No medium or high risk tasks open.</div>'}</div>
      <button class="btn ai sm" style="margin-top:10px" data-act="ask" data-q="Run a risk review of this project: technical risks, missing tasks, dependency problems and estimates that look optimistic against the deadline. Propose concrete fixes.">${ICON.spark}Run risk review</button></div>
    <div class="panel"><h2>Effort by task list</h2><div class="bars">${byList.map(b=>`<div class="bar-row"><span class="rtitle">${esc(b.n)}</span><span class="meter" title="Logged ${r1(b.L)}h of ${r1(b.E)}h"><i style="width:${b.E?Math.min(100,b.L/b.E*100):0}%"></i></span><span class="mono">${r1(b.L)}/${r1(b.E)}h</span></div>`).join('')}</div>
      ${nextMs?`<div class="sec" style="margin:14px 0 6px">Next milestone</div><div class="line"><span class="g-ms" style="position:static;display:inline-block;transform:rotate(45deg)"></span><span class="grow">${esc(nextMs.title)}</span><span class="tid">${fmtD(nextMs.due)}</span></div>`:''}</div>

function workload(onlyPid){
  const w0=weekStart(today());const weeks=[0,1,2,3].map(i=>addDays(w0,i*7));
  const load={};S.ws.people.forEach(x=>load[x.id]=[0,0,0,0]);
  for(const p of Object.values(S.projects)){if(onlyPid&&p.id!==onlyPid)continue;const sch=schedule(p),lg=loggedMap(p);
    for(const t of p.tasks){if(isDone(t)||!t.assignees.length)continue;const rem=Math.max(0,pert(t).E-(lg[t.id]||0));if(!rem)continue;
      const when=isISO(t.due)?t.due:addDays(sch.base,sch.map[t.id].ef-1);let wi=Math.floor(dIdx(weekStart(when<today()?today():when),w0)/7);if(wi<0)wi=0;if(wi>3)continue;
      for(const a of t.assignees)if(load[a])load[a][wi]+=rem/t.assignees.length}}
  return`<div class="wl"><table><tr><th></th>${weeks.map((w,i)=>`<th>${i===0?'This week':'Week of '+fmtD(w)}</th>`).join('')}<th>Capacity</th></tr>
  ${S.ws.people.map(x=>`<tr><td class="who"><span style="display:inline-flex;gap:8px;align-items:center">${av(x.id)}${esc(x.name)}</span></td>${load[x.id].map(h=>{const c=num(x.capacity,30);const r=h/c;return`<td class="h ${h===0?'lv0':r<=.8?'lv1':r<=1?'lv2':'lv3'}">${r1(h)}h</td>`}).join('')}<td class="h">${num(x.capacity,30)}h/wk</td></tr>`).join('')}</table></div>
  <p class="empty-note">Remaining expected hours of open tasks, placed in the week they are due (or scheduled to finish).</p>`;
}
function dashboard(){
  const ps=Object.values(S.projects);
  if(!ps.length)return emptyState();
  const td=today(),wk=addDays(td,7);
  const due=[];for(const p of ps)for(const t of p.tasks)if(!isDone(t)&&isISO(t.due)&&t.due<=wk)due.push([p,t]);
  due.sort((a,b)=>a[1].due.localeCompare(b[1].due));
  return topbar('Dashboard',`${ps.length} projects · ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}`,`<button class="btn primary" data-act="modal" data-m="new">${ICON.plus}Project</button>`)+timerBar()+
  `<div class="pcards">${ps.map(p=>{const st=stats(p);const nm=p.milestones.filter(m=>!m.done&&isISO(m.due)).sort((a,b)=>a.due.localeCompare(b.due))[0];const pct=st.total?Math.round(st.done/st.total*100):0;const bh=num(p.budgetHours);
    return`<button class="pcard" data-act="open-project" data-id="${p.id}"><h3><span class="dot" style="--c:${esc(p.color)}"></span>${esc(p.name)}</h3>
      <div class="row2"><span>${esc(p.client||'No client')}</span><span class="health ${st.health}">${st.daysLeft==null?'No deadline':st.hl}</span></div>
      <span class="meter" style="width:100%"><i style="width:${pct}%"></i></span>
      <div class="row2"><span>${st.done}/${st.total} tasks</span><span class="mono">${fmtH(st.p50)} left</span></div>
      <div class="row2"><span>${bh?`Budget ${Math.round(st.logged/bh*100)}% used`:fmtH(st.logged)+' logged'}</span><span>${nm?'◆ '+esc(nm.title)+' '+fmtD(nm.due):isISO(p.deadline)?'Due '+fmtD(p.deadline):''}</span></div>
      ${st.overdue?`<span class="chip crit" style="justify-self:start">${st.overdue} overdue</span>`:''}</button>`}).join('')}</div>
  <div class="grid2"><div class="panel"><h2>Workload</h2>${workload()}</div>
  <div class="panel"><h2>Due in the next 7 days</h2><div class="lines">${due.slice(0,14).map(([p,t])=>`<div class="line click" data-act="open-task-in" data-pid="${p.id}" data-id="${t.id}"><span class="dot" style="--c:${esc(p.color)}"></span><span class="grow">${t.id} ${esc(t.title)}</span><span class="chip ${t.due<td?'crit':t.due===td?'warn':''}">${fmtD(t.due)}</span></div>`).join('')||'<div class="empty-note">Nothing due this week.</div>'}</div>
    <button class="btn ai sm" style="margin-top:10px" data-act="ask" data-q="Plan my next 5 working days across all my projects: which tasks each day, in order, respecting deadlines, the critical path and my hours per day.">${ICON.spark}Plan my week</button></div></div>`;
}
function myWork(){
  const me=S.filter.who||'me';const td=today(),wk=addDays(td,7);
  const groups={Overdue:[],Today:[],'This week':[],Later:[],'No due date':[]};
  for(const p of Object.values(S.projects))for(const t of p.tasks){if(isDone(t)||!t.assignees.includes(me))continue;
    const d=t.due;const g=!isISO(d)?'No due date':d<td?'Overdue':d===td?'Today':d<=wk?'This week':'Later';groups[g].push([p,t])}
  return topbar('My work',`Open tasks assigned to <select class="field" data-ff="who" id="mw-who" style="padding:2px 6px">${opts(S.ws.people.map(x=>[x.id,x.name]),me)}</select> across every project`,'')+timerBar()+
  Object.entries(groups).map(([g,list])=>list.length?`<section class="tlist"><div class="tlist-h"><h3>${g}</h3><span class="tid">${list.length}</span></div>
    ${list.sort((a,b)=>(a[1].due||'9').localeCompare(b[1].due||'9')||byOrder(a[1],b[1])).map(([p,t])=>`<div class="row" data-act="open-task-in" data-pid="${p.id}" data-id="${t.id}">
      <button class="check" data-act="toggle-done-in" data-pid="${p.id}" data-id="${t.id}" aria-label="Complete ${esc(t.title)}"></button><span class="tid">${t.id}</span>
      <span class="rtitle">${esc(t.title)} <span class="tid">· ${esc(p.name)}</span></span>
      <span class="chips rmeta">${flag(t.priority)}${isISO(t.due)?`<span class="chip ${g==='Overdue'?'crit':''}">${fmtD(t.due)}</span>`:''}<span class="chip mono">${fmtH(pert(t).E)}</span><button class="btn sm" data-act="timer-in" data-pid="${p.id}" data-id="${t.id}">${S.ws.timer&&S.ws.timer.task===t.id&&S.ws.timer.pid===p.id?'Running':'Start timer'}</button></span></div>`).join('')}</section>`:'').join('')
  +(Object.values(groups).every(l=>!l.length)?'<div class="panel empty-note">No open tasks assigned. Enjoy the quiet or pick something from a project backlog.</div>':'');

/* ============ agent ============ */
const RULES=`You are the planning agent inside "Workbench", a project management tool (similar to Teamwork.com) used by a technical freelancer. You support every request and task: planning, breaking down work, estimating, scheduling, scoping change requests, risk review, time and billing questions, client communication and technical design.
Be concrete and technical: name endpoints, data models, libraries, edge cases, test steps and deployment details when relevant. Use three-point estimates in hours (o optimistic, m most likely, p pessimistic); keep tasks small (m under about 8h) and split larger work into subtasks. Treat requests outside the brief as change orders. Respect the freelancer's hoursPerDay and the deadline. Today is given in the data.
Reply with ONLY one JSON object, no prose outside it:
{"reply": string, "actions": [ ... ]}
"reply": plain text for the user, under 250 words. Use short paragraphs, "- " bullets and **bold**. When drafting an email or client message, put the full draft in the reply.
"actions": changes you propose; the user reviews and applies each one. Use [] when nothing should change. Allowed shapes:
{"type":"add_list","name":"Sprint 2"}
{"type":"add_milestone","ref":"m1","title":"MVP handover","due":"YYYY-MM-DD","desc":"..."}
{"type":"add_task","ref":"a","task":{"title":"...","list":"list name","parent":"T-3 or ref","milestone":"milestone title, id or ref","priority":"high|medium|low|none","status":"backlog|todo|doing|review|done","assignees":["person id"],"tags":["backend"],"est":{"o":2,"m":3,"p":6},"start":"YYYY-MM-DD","due":"YYYY-MM-DD","deps":["T-2","a"],"risk":"low|med|high","criteria":["Given... when... then..."],"notes":"technical notes","request":"R-1","billable":true}}
{"type":"update_task","id":"T-4","patch":{ any task fields above }}
{"type":"delete_task","id":"T-4"}
{"type":"log_time","task":"T-4","hours":1.5,"date":"YYYY-MM-DD","note":"...","billable":true}
{"type":"add_note","title":"Technical spec","body":"markdown text"}
{"type":"update_request","id":"R-1","patch":{"status":"new|triaged|converted|declined","impact":"in-scope|change-order"}}
{"type":"update_project","patch":{"deadline":"YYYY-MM-DD","budgetHours":80,"brief":"...","stack":"..."}}
Use existing ids exactly as given. Give new tasks and milestones a short "ref" when other new items depend on them, and use that ref in deps, parent or milestone. A list name that does not exist yet is created. Only log time the user says they actually spent.`;

async function askAgent(text){
  const p=P();text=String(text||'').trim();
  if(!text||S.busy)return;
  if(!AI){S.ai=true;render();toast(S.aiOff||'The agent is available when this page is open in Claude.');return}
  if(!p&&S.page==='project')return;
  const target=p||null;const chat=target?target.chat:(S.ws.chat=S.ws.chat||[]);
  chat.push({role:'user',content:text});S.busy=true;S.ai=true;render();scrollLog();
  CTL=new AbortController();
  const hist=chat.filter(m=>m.role==='user'||m.role==='assistant').slice(-12,-1).map(m=>({role:m.role,content:m.content||'(empty)'}));
  if(hist.length&&hist[0].role==='assistant')hist.shift();
  const ctx=S.page==='project'&&target?projectContext(target):{today:today(),view:S.page,people:S.ws.people.map(x=>({id:x.id,name:x.name,capacityPerWeek:x.capacity})),portfolio:portfolioContext(),note:'No single project is open, so propose no actions; answer from the portfolio.'};
  const turns=[{role:'user',content:RULES+'\n\nCURRENT DATA (JSON):\n'+JSON.stringify(ctx)},...hist,{role:'user',content:text}];
  let added=null;
  try{
    const res=await AI.json(turns,{cache:false,signal:CTL.signal});
    const reply=typeof res==='string'?res:(res&&typeof res.reply==='string'?res.reply:'Done.');
    const acts=(res&&Array.isArray(res.actions)&&S.page==='project')?res.actions.filter(a=>a&&typeof a==='object'&&typeof a.type==='string').slice(0,60):[];
    added={role:'assistant',content:reply,actions:acts.map(a=>Object.assign(a,{applied:false})),refs:{}};
  }catch(e){
    const c=e&&e.code;
    if(c==='cancelled')added={role:'note',content:'Stopped.'};
    else if(c==='invalid_json'&&e.text)added={role:'assistant',content:e.text,actions:[]};
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){S.aiOff='The agent is turned off for this page. Allow Claude for this artifact to use it.';AI=null;added={role:'note',content:S.aiOff}}
    else if(c==='rate_limited')added={role:'note',content:'Too many requests just now. Try again in a minute.'};
    else if(c==='prompt_too_large')added={role:'note',content:'This project is too large to send in one go. Archive old time entries or notes, or ask about one task at a time.'};
    else if(c==='refused')added={role:'note',content:'The agent declined that request. Try rephrasing it.'};
    else added={role:'note',content:'The agent could not answer (connection problem). Try again.'};
  }finally{
    if(added)chat.push(added);
    while(chat.length>40)chat.shift();
    S.busy=false;CTL=null;
    if(target)touch(target);else touchWs();
    render();scrollLog();
  }
}
function scrollLog(){const l=$('#ai-log');if(l)l.scrollTop=l.scrollHeight}
function describe(p,a){
  const t=a.task||{};
  switch(a.type){
    case 'add_task':{const e=t.est||{};return[`Add task${t.parent?' under '+t.parent:''}`,`${t.title||'Untitled'}${t.list?' · '+t.list:''}${e.m?` · ${e.o??'?'}/${e.m}/${e.p??'?'}h`:''}${(t.deps||[]).length?' · after '+t.deps.join(', '):''}`]}
    case 'update_task':{const x=p.tasks.find(y=>y.id===a.id);return[`Update ${a.id}`,`${x?x.title+' · ':''}${Object.entries(a.patch||{}).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(', ').slice(0,160)}`]}
    case 'delete_task':{const x=p.tasks.find(y=>y.id===a.id);return[`Delete ${a.id}`,x?x.title:'(not found)']}
    case 'add_list':return['Add task list',a.name];
    case 'add_milestone':return['Add milestone',`${a.title}${a.due?' · '+fmtD(a.due):''}`];
    case 'log_time':return[`Log ${a.hours}h on ${a.task}`,a.note||''];
    case 'add_note':return['Add notebook page',a.title];
    case 'update_request':return[`Update ${a.id}`,Object.entries(a.patch||{}).map(([k,v])=>k+': '+v).join(', ')];
    case 'update_project':return['Update project',Object.keys(a.patch||{}).join(', ')];
