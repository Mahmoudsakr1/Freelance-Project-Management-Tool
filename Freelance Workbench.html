  }
}
function listByName(p,name,create){if(!name)return null;const n=String(name).trim().toLowerCase();let l=p.lists.find(x=>x.name.toLowerCase()===n||x.id===name);if(!l&&create){l={id:uid(),name:String(name).trim()};p.lists.push(l)}return l}
function patchTask(p,t,src,resolve){
  if(typeof src.title==='string'&&src.title.trim())t.title=src.title.trim().slice(0,200);
  if(STATUSES.some(s=>s[0]===src.status))setStatus(p,t,src.status);
  if(PRIS.some(s=>s[0]===src.priority))t.priority=src.priority;
  if(RISKS.some(s=>s[0]===src.risk))t.risk=src.risk;
  if(src.list){const l=listByName(p,src.list,true);if(l)t.list=l.id}
  if(src.est&&typeof src.est==='object'){const o=num(src.est.o,NaN),m=num(src.est.m,NaN),pp=num(src.est.p,NaN);
    const mm=Number.isFinite(m)?m:Number.isFinite(o)&&Number.isFinite(pp)?(o+pp)/2:NaN;
    if(Number.isFinite(mm))t.est={o:Number.isFinite(o)?o:r1(mm*.7),m:mm,p:Number.isFinite(pp)?pp:r1(mm*1.6)}}
  if(src.start!==undefined)t.start=isISO(src.start)?src.start:'';
  if(src.due!==undefined)t.due=isISO(src.due)?src.due:'';
  if(Array.isArray(src.tags))t.tags=src.tags.map(String).map(s=>s.trim()).filter(Boolean).slice(0,10);
  if(Array.isArray(src.assignees)){const a=src.assignees.map(String).filter(id=>person(id));if(a.length||!src.assignees.length)t.assignees=a}
  if(Array.isArray(src.deps))t.deps=[...new Set(src.deps.map(String).map(resolve).filter(d=>d&&d!==t.id))];
  if(src.parent!==undefined){const pr=src.parent?resolve(String(src.parent)):'';t.parent=pr&&pr!==t.id?pr:''}
  if(src.milestone!==undefined){const v=String(src.milestone||'');const m=p.milestones.find(x=>x.id===v||x.title.toLowerCase()===v.toLowerCase())||(resolve.ms&&resolve.ms(v));t.milestone=m?m.id:''}
  if(Array.isArray(src.criteria))t.criteria=src.criteria.map(c=>typeof c==='string'?{t:c,done:false}:{t:String(c.t||c.text||''),done:!!c.done}).filter(c=>c.t);
  if(typeof src.notes==='string')t.notes=src.notes.slice(0,6000);
  if(src.progress!==undefined)t.progress=Math.max(0,Math.min(100,Math.round(num(src.progress))));
  if(typeof src.billable==='boolean')t.billable=src.billable;
  if(src.request!==undefined)t.request=p.requests.some(r=>r.id===src.request)?src.request:'';
  if(src.custom&&typeof src.custom==='object')for(const [k,v] of Object.entries(src.custom)){const f=p.fields.find(x=>x.name.toLowerCase()===k.toLowerCase()||x.id===k);if(f)t.custom[f.id]=String(v)}
}
function applyAction(p,msg,i){
  const a=msg.actions[i];if(!a||a.applied)return;msg.refs=msg.refs||{};
  const resolve=d=>msg.refs[d]||(p.tasks.some(t=>t.id===d)?d:null);
  resolve.ms=v=>{const id=msg.refs['ms:'+v];return id?p.milestones.find(m=>m.id===id):null};
  switch(a.type){
    case 'add_task':{const src=a.task||{};const t=newTask(p,{title:'Untitled task',assignees:['me']});patchTask(p,t,src,resolve);
      if(a.ref){msg.refs[a.ref]=t.id;
        msg.actions.forEach(b=>{if(b.applied&&b.type==='add_task'&&b.createdId){const bt=p.tasks.find(x=>x.id===b.createdId);if(!bt)return;
          if((b.task?.deps||[]).includes(a.ref)&&!bt.deps.includes(t.id))bt.deps.push(t.id);if(b.task?.parent===a.ref)bt.parent=t.id}})}
      a.createdId=t.id;logAct(p,`Agent added ${t.id} ${t.title}`);break}
    case 'update_task':{const t=p.tasks.find(x=>x.id===a.id);if(!t)throw new Error(`${a.id} no longer exists`);patchTask(p,t,a.patch||{},resolve);logAct(p,`Agent updated ${t.id}`);break}
    case 'delete_task':{if(!p.tasks.some(x=>x.id===a.id))throw new Error(`${a.id} no longer exists`);deleteTask(p,a.id);logAct(p,`Agent deleted ${a.id}`);break}
    case 'add_list':listByName(p,a.name||'New list',true);break;
    case 'add_milestone':{const m={id:uid(),title:String(a.title||'Milestone'),due:isISO(a.due)?a.due:'',desc:String(a.desc||''),done:false};p.milestones.push(m);if(a.ref)msg.refs['ms:'+a.ref]=m.id;msg.refs['ms:'+m.title]=m.id;
      msg.actions.forEach(b=>{if(b.applied&&b.type==='add_task'&&b.createdId&&(b.task?.milestone===a.ref||b.task?.milestone===m.title)){const bt=p.tasks.find(x=>x.id===b.createdId);if(bt)bt.milestone=m.id}});break}
    case 'log_time':{if(!p.tasks.some(x=>x.id===a.task))throw new Error(`${a.task} not found`);const h=num(a.hours);if(!(h>0))throw new Error('Hours must be positive');p.time.push({id:uid(),task:a.task,person:'me',date:isISO(a.date)?a.date:today(),hours:h,note:String(a.note||''),billable:a.billable!==false,invoiced:''});break}
    case 'add_note':{const n={id:uid(),title:String(a.title||'Untitled'),body:String(a.body||''),updated:Date.now()};p.notes.push(n);S.noteId=n.id;break}
    case 'update_request':{const r=p.requests.find(x=>x.id===a.id);if(!r)throw new Error(`${a.id} not found`);const pt=a.patch||{};if(['new','triaged','converted','declined'].includes(pt.status))r.status=pt.status;if(['in-scope','change-order'].includes(pt.impact))r.impact=pt.impact;break}
    case 'update_project':{const pt=a.patch||{};if(pt.deadline!==undefined)p.deadline=isISO(pt.deadline)?pt.deadline:p.deadline;if(pt.budgetHours!==undefined)p.budgetHours=num(pt.budgetHours,p.budgetHours);if(typeof pt.brief==='string')p.brief=pt.brief;if(typeof pt.stack==='string')p.stack=pt.stack;if(pt.hoursPerDay)p.hoursPerDay=num(pt.hoursPerDay,p.hoursPerDay);break}
    default:throw new Error('Unknown action');
  }
  a.applied=true;
}

    case 'toggle-done-in':{e.stopPropagation();const q=S.projects[el.dataset.pid];const t=q&&q.tasks.find(x=>x.id===id);if(t){setStatus(q,t,'done');touch(q);toast(`Completed ${t.id}`);render()}break}

    case 'del-msg':commit(p=>{p.messages=p.messages.filter(m=>m.id!==id)});break;
    case 'del-link':commit(p=>{p.links=p.links.filter(l=>l.id!==id)});break;
    case 'rename-list':S.renaming=id;renderMain();setTimeout(()=>{const i=$('#rn-'+id);if(i){i.focus();i.select()}},0);break;
    case 'del-list':{const n=p.tasks.filter(t=>t.list===id).length;if(p.lists.length<2){toast('A project needs at least one task list.');break}
      confirmAsk('Delete task list?',n?`Its ${n} tasks move to the first remaining list.`:'This list is empty.','del-list',id,'Delete list');break}
    case 'clear-filters':S.filter={q:'',who:'',tag:'',pri:'',due:'',done:S.filter.done};renderMain();break;
    case 'del-field':commit(p=>{p.fields=p.fields.filter(f=>f.id!==id);delete p.layers['f_'+id]});S.layersOpen=true;renderMain();break;
    case 'cal':{if(el.dataset.d==='0')S.cal=today().slice(0,7);else{const [y,m]=S.cal.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+Number(el.dataset.d),1));S.cal=d.toISOString().slice(0,7)}renderMain();break}
    case 'ms-done':commit(p=>{const m=p.milestones.find(x=>x.id===id);if(m){m.done=!m.done;if(m.done)logAct(p,`Milestone reached: ${m.title}`)}});break;
    case 'del-ms':commit(p=>{p.milestones=p.milestones.filter(m=>m.id!==id);p.tasks.forEach(t=>{if(t.milestone===id)t.milestone=''})});S.modal=null;render();break;

    case 'make-invoice':commit(p=>{const es=p.time.filter(x=>x.billable!==false&&!x.invoiced);if(!es.length)return;const h=es.reduce((s,x)=>s+num(x.hours),0);
      const inv={id:uid(),number:'INV-'+String(++p.invSeq).padStart(3,'0'),date:today(),hours:r1(h),rate:num(p.rate),total:Math.round(h*num(p.rate)*100)/100,status:'draft'};p.invoices.push(inv);es.forEach(x=>x.invoiced=inv.id);logAct(p,`Created ${inv.number} for ${money(inv.total,p.currency)}`)});break;
    case 'del-invoice':confirmAsk('Void invoice?','Its time entries become available to invoice again.','del-invoice',id,'Void invoice');break;
    case 'copy-invoice':{const i=p.invoices.find(x=>x.id===id);if(!i)break;const txt=`Invoice ${i.number} · ${p.client||''} · ${fmtD(i.date)}\n`+invoiceLines(p,i).map(l=>`${l.label} — ${r1(l.h)}h × ${money(i.rate,p.currency)} = ${money(l.h*i.rate,p.currency)}`).join('\n')+`\nTotal: ${money(i.total,p.currency)}`;copyText(txt);break}
    case 'req-task':commit(p=>{const r=p.requests.find(x=>x.id===id);if(!r)return;const t=newTask(p,{title:r.text.split('\n')[0].slice(0,90),request:r.id,notes:r.text});r.status='converted';S.drawer=t.id});break;
    case 'new-note':commit(p=>{const n={id:uid(),title:'Untitled page',body:'',updated:Date.now()};p.notes.push(n);S.noteId=n.id});setTimeout(()=>{const i=$('#nb-title');if(i){i.focus();i.select()}},0);break;
    case 'open-note':S.noteId=id;renderMain();break;
    case 'del-note':confirmAsk('Delete page?','This notebook page will be removed.','del-note',id);break;
    case 'assign':commit(p=>{const t=p.tasks.find(x=>x.id===id);const w=el.dataset.who;t.assignees=t.assignees.includes(w)?t.assignees.filter(x=>x!==w):[...t.assignees,w]},'drawer');break;
    case 'rm-dep':commit(p=>{const t=p.tasks.find(x=>x.id===id);t.deps=t.deps.filter(d=>d!==el.dataset.dep)},'drawer');break;
    case 'rm-ac':commit(p=>{const t=p.tasks.find(x=>x.id===id);t.criteria.splice(Number(el.dataset.i),1)},'drawer');break;
    case 'dup-task':commit(p=>{const t=p.tasks.find(x=>x.id===id);const c=clone(t);delete c.id;c.title=t.title+' (copy)';c.comments=[];c.status='todo';c.progress=0;const n=newTask(p,c);n.id='T-'+p.seq;S.drawer=n.id});break;
    case 'confirm':{const c=el.dataset.c;if(c==='del-task')confirmAsk('Delete task?',`${id} and its unbilled time entries will be removed. Subtasks are kept.`,'del-task',id);else if(c==='del-project')confirmAsk('Delete project?',`"${p.name}" with all tasks, time, invoices and notes will be permanently removed.`,'del-project',p.id,'Delete project');break}
    case 'do-confirm':doConfirm();break;
    case 'close-modal':S.modal=null;renderModal();break;
    case 'modal':S.modal={type:el.dataset.m,id,tpl:el.dataset.tpl};S.side=false;renderModal();renderSide();updateScrim();break;
    case 'del-person':commitWs(ws=>{ws.people=ws.people.filter(x=>x.id!==id)});Object.values(S.projects).forEach(q=>{let ch=false;q.tasks.forEach(t=>{if(t.assignees.includes(id)){t.assignees=t.assignees.filter(x=>x!==id);ch=true}});if(ch)touch(q)});render();break;
    case 'ai-toggle':S.ai=!S.ai;render();if(S.ai)setTimeout(()=>{scrollLog();const i=$('#ai-input');if(i)i.focus()},0);break;
    case 'ai-stop':if(CTL)CTL.abort();break;
    case 'ai-clear':if(S.page==='project'&&p)commit(p=>{p.chat=[]});else commitWs(ws=>{ws.chat=[]});break;
    case 'unfocus':S.focusTask=null;renderAI();break;
    case 'ask':S.ai=true;askAgent(el.dataset.q);break;
    case 'ask-task':S.focusTask=id;S.ai=true;render();setTimeout(()=>{const i=$('#ai-input');if(i){i.value=`About ${id}: `;i.focus()}},0);break;
    case 'apply':case 'apply-all':case 'skip':{
      const msg=p&&p.chat[Number(el.dataset.m)];if(!msg)break;
      if(act==='skip'){msg.actions[Number(el.dataset.i)].applied=true;msg.actions[Number(el.dataset.i)].skipped=true;touch(p);renderAI();break}
      const idx=act==='apply'?[Number(el.dataset.i)]:msg.actions.map((a,i)=>a.applied?-1:i).filter(i=>i>=0);
      const order=[...idx.filter(i=>['add_list','add_milestone'].includes(msg.actions[i].type)),...idx.filter(i=>msg.actions[i].type==='add_task'),...idx.filter(i=>!['add_list','add_milestone','add_task'].includes(msg.actions[i].type))];
      let ok=0,fail=[];
      for(const i of order){try{applyAction(p,msg,i);ok++}catch(err){fail.push(err.message)}}
      if(act==='apply-all'){for(const i of order){const a=msg.actions[i];if(a.type==='add_task'&&a.createdId){const t=p.tasks.find(x=>x.id===a.createdId);if(t){if(Array.isArray(a.task?.deps))t.deps=[...new Set(a.task.deps.map(String).map(d=>msg.refs[d]||(p.tasks.some(x=>x.id===d)?d:null)).filter(d=>d&&d!==t.id))];if(a.task?.parent&&msg.refs[a.task.parent])t.parent=msg.refs[a.task.parent]}}}}
      touch(p);render();toast(fail.length?`Applied ${ok}. Skipped ${fail.length}: ${fail[0]}`:`Applied ${ok} change${ok===1?'':'s'}`);break}
    case 'copy-msg':{const msg=(S.page==='project'&&p?p.chat:(S.ws.chat||[]))[Number(el.dataset.m)];if(msg)copyText(msg.content);break}
    default:if(EXT[act])EXT[act](el,e);
  }
});
function doConfirm(){
  const m=S.modal;if(!m)return;const p=P();S.modal=null;
  switch(m.c){
    case 'del-task':commit(p=>{deleteTask(p,m.id);logAct(p,`Deleted ${m.id}`)});S.drawer=null;render();break;
    case 'del-list':commit(p=>{const rest=p.lists.filter(l=>l.id!==m.id);p.tasks.forEach(t=>{if(t.list===m.id)t.list=rest[0].id});p.lists=rest});break;
    case 'del-invoice':commit(p=>{p.invoices=p.invoices.filter(i=>i.id!==m.id);p.time.forEach(x=>{if(x.invoiced===m.id)x.invoiced=''})});break;
    case 'del-note':commit(p=>{p.notes=p.notes.filter(n=>n.id!==m.id)});S.noteId=null;render();break;
    case 'del-project':{const id=m.id;delete S.projects[id];queue('p:'+id);normalizeCur();S.page=S.cur?'project':'dashboard';S.drawer=null;toast('Project deleted');render();break}
    default:if(EXTC[m.c])EXTC[m.c](m);
  }
  renderModal();
}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Select the text and copy it manually')}ta.remove()}}

function setField(t,f,v,p){
  if(f.startsWith('est.')){t.est=t.est||{};t.est[f.slice(4)]=v===''?'':num(v);return}
  if(f.startsWith('custom.')){t.custom[f.slice(7)]=v;return}
  switch(f){
    case 'status':setStatus(p,t,v);break;
    case 'tags':t.tags=String(v).split(',').map(s=>s.trim()).filter(Boolean);break;
    case 'deps':t.deps=[...new Set(String(v).toUpperCase().split(/[\s,]+/).filter(d=>d&&d!==t.id&&p.tasks.some(x=>x.id===d)))];break;
    case 'owner':t.assignees=v?[v,...t.assignees.filter(x=>x!==v)].slice(0,Math.max(1,t.assignees.length)):[];break;
    case 'progress':t.progress=Math.max(0,Math.min(100,num(v)));if(t.progress===100&&!isDone(t))setStatus(p,t,'review');break;
    case 'billable':case 'private':t[f]=!!v;break;
    case 'title':t.title=String(v).trim()||t.title;break;
    default:t[f]=v;
  }
}

    const v=el.type==='checkbox'?el.checked:el.value;const f=el.dataset.tf;
    const inDrawer=!!el.closest('.drawer');const textual=el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','date','range'].includes(el.type));
    commit(p=>setField(t,f,v,p),textual?'none':(inDrawer?'drawer':'all'));
    if(textual&&f.startsWith('est.')){const c=document.querySelector(`[data-e="${t.id}"]`);if(c){const k=pert(t);c.textContent=k.has?r1(k.E):''}}

    if(textual&&inDrawer&&f.startsWith('est.')){renderMain();const fo=document.activeElement;renderDrawerKeepFocus(fo)}
    return}
  if(el.dataset.ff){S.filter[el.dataset.ff]=el.type==='checkbox'?el.checked:el.value;renderMain();return}
  if(el.dataset.layer){commit(p=>{p.layers[el.dataset.layer]=el.checked});S.layersOpen=true;renderMain();return}
  if(el.dataset.adddep){const v=el.value;if(v)commit(p=>{const t=p.tasks.find(x=>x.id===el.dataset.adddep);if(!t.deps.includes(v))t.deps.push(v)},'drawer');return}
  if(el.dataset.ac!==undefined){commit(p=>{const t=p.tasks.find(x=>x.id===el.dataset.id);t.criteria[Number(el.dataset.ac)].done=el.checked},'drawer');return}
  if(el.dataset.inv){commit(p=>{const i=p.invoices.find(x=>x.id===el.dataset.inv);if(i){i.status=el.value;logAct(p,`${i.number} marked ${el.value}`)}});return}
  if(el.dataset.req){commit(p=>{const r=p.requests.find(x=>x.id===el.dataset.req);if(r)r.status=el.value});return}
  if(el.dataset.rp){S.report[el.dataset.rp]=el.value;S.report.summary=null;renderMain();return}
  if(el.dataset.scan!==undefined&&S.scan&&S.scan.list){S.scan.list[Number(el.dataset.scan)].pick=el.checked;return}
  if(el.dataset.ncheck!==undefined){const n=S.col.notes[S.noteSel];if(!n)return;const ls=(n.body||'').split('\n');const i=Number(el.dataset.ncheck);ls[i]=ls[i].replace(/\[( |x|X)\]/,el.checked?'[x]':'[ ]');n.body=ls.join('\n');saveDoc('notes',n,'main');return}
  if(el.dataset.nsort){S.noteSort=el.value;renderMain();return}
  if(el.dataset.lp){S.libProj=el.value;renderMain();return}
  if(el.dataset.nf&&el.tagName==='SELECT'){const n=S.col.notes[el.dataset.id];if(!n)return;n[el.dataset.nf]=el.value;saveDoc('notes',n,'main');return}
  if(el.dataset.nf==='tags'){const n=S.col.notes[el.dataset.id];if(!n)return;n.tags=el.value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);saveDoc('notes',n,'none');return}
  if(el.dataset.person){commitWs(ws=>{const x=ws.people.find(y=>y.id===el.dataset.id);if(!x)return;if(el.dataset.person==='name'){x.name=el.value.trim()||x.name;x.initials=initials(x.name)}else x.capacity=num(el.value,x.capacity)},'none');renderSide();return}

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());const p=P();
  switch(f.dataset.form){
    case 'quick-task':{const title=(fd.title||'').trim();if(!title)return;const id=f.querySelector('input').id;
      commit(p=>{const t=newTask(p,{title,list:f.dataset.list||p.lists[0].id});if(f.dataset.status)t.status=f.dataset.status;if(S.filter.who)t.assignees=[S.filter.who]});
      const n=document.getElementById(id);if(n)n.focus();break}
    case 'add-list':{const name=(fd.name||'').trim();if(!name)return;commit(p=>{p.lists.push({id:uid(),name})});const n=$('#new-list');if(n)n.focus();break}
    case 'rename-list':{const name=(fd.name||'').trim();S.renaming=null;commit(p=>{const l=p.lists.find(x=>x.id===f.dataset.id);if(l&&name)l.name=name});break}
    case 'add-field':{const name=(fd.name||'').trim();if(!name)return;commit(p=>{const id=uid();p.fields.push({id,name,type:fd.type||'text'});p.layers['f_'+id]=true});S.layersOpen=true;renderMain();break}

    case 'milestone-edit':commit(p=>{const m=p.milestones.find(x=>x.id===f.dataset.id);if(m){m.title=fd.title.trim()||m.title;m.due=fd.due||'';m.desc=fd.desc||''}});S.modal=null;render();break;
    case 'log-time':{const h=num(fd.hours);if(!(h>0)){toast('Enter the hours spent');return}commit(p=>{p.time.push({id:uid(),task:fd.task,person:fd.person||'me',date:fd.date||today(),hours:h,note:fd.note||'',billable:!!fd.billable,invoiced:''});logAct(p,`Logged ${fmtH(h)} on ${fd.task}`)});toast(`Logged ${fmtH(h)}`);break}
    case 'quick-log':{const h=num(fd.hours);if(!(h>0))return;commit(p=>{p.time.push({id:uid(),task:f.dataset.id,person:'me',date:today(),hours:h,note:'',billable:true,invoiced:''})},'drawer');toast(`Logged ${fmtH(h)}`);break}
    case 'budget':commit(p=>{p.rate=num(fd.rate,p.rate);p.currency=fd.currency;p.budgetHours=num(fd.budgetHours,0);p.fixedFee=num(fd.fixedFee,0)});toast('Saved');break;
    case 'request':{const text=(fd.text||'').trim();if(!text)return;commit(p=>{const r={id:'R-'+(++p.rseq),from:fd.from||'',date:fd.date||today(),text,status:'new',impact:''};p.requests.push(r);logAct(p,`Request ${r.id} logged`)});break}
    case 'add-ac':{const t=(fd.t||'').trim();if(!t)return;commit(p=>{p.tasks.find(x=>x.id===f.dataset.id).criteria.push({t,done:false})},'drawer');const n=$('#d-newac');if(n)n.focus();break}
    case 'add-sub':{const title=(fd.title||'').trim();if(!title)return;commit(p=>{const par=p.tasks.find(x=>x.id===f.dataset.id);newTask(p,{title,parent:par.id,list:par.list,milestone:par.milestone,assignees:[...par.assignees]})},'drawer');const n=$('#d-newsub');if(n)n.focus();break}
    case 'message':commit(p=>{p.messages.push({id:uid(),title:fd.title.trim(),body:fd.body,by:'me',at:nowStamp(),replies:[]});logAct(p,`Message posted: ${fd.title.trim()}`)});break;
    case 'reply':{const text=(fd.text||'').trim();if(!text)return;commit(p=>{const m=p.messages.find(x=>x.id===f.dataset.id);if(m)(m.replies=m.replies||[]).push({by:'me',at:nowStamp(),text})});break}

});

function saveDoc(col,doc,how='all'){

function delDoc(col,id){delete S.col[col][id];persistCols();const key=col+'/'+id;dirty.add(key);qseq[key]=(qseq[key]||0)+1;clearTimeout(colTimers[key]);flushDoc(col,id);render()}
async function flushDoc(col,id){
  const key=col+'/'+id;if(S.mode!=='db'||!DB){dirty.delete(key);return}
  const my=qseq[key];if(colInflight[key])await colInflight[key].catch(()=>{});
  const d=S.col[col][id];const ref=DB.collection(col).doc(id);
  if(d)lastJSON[key]=JSON.stringify(d);
  colInflight[key]=d?ref.set(clone(d)):ref.delete();
  try{await colInflight[key]}catch(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Remove old notes or library items, then try again.':'Could not save to your workspace. Kept in this browser for now.')}
  finally{colInflight[key]=null;if(qseq[key]===my)dirty.delete(key)}
}
function subscribeCols(){
  for(const col of COLS){
    DB.collection(col).onSnapshot(snap=>{let ch=false;const seen=new Set();
      for(const d of snap.docs){seen.add(d.id);const key=col+'/'+d.id;if(dirty.has(key))continue;const j=JSON.stringify(d.data());if(lastJSON[key]===j&&S.col[col][d.id])continue;lastJSON[key]=j;S.col[col][d.id]=JSON.parse(j);ch=true}
      if(!snap.metadata.fromCache)for(const id of Object.keys(S.col[col]))if(!seen.has(id)&&!dirty.has(col+'/'+id)){delete S.col[col][id];ch=true}
      if(ch){persistCols();safeRender()}
    },()=>{});
  }
}

function gmailErr(e){
  const c=e&&e.code;
  if(!MCP)return{msg:'Gmail works when this page is open in Claude.',allow:false};
  switch(c){
    case 'server_not_connected':return{msg:'Gmail is not connected to your Claude account. Add it in claude.ai Settings → Connectors, then reload this page.'};
    case 'needs_reauth':return{msg:'Your Gmail connection expired. Reconnect Gmail in claude.ai Settings → Connectors.'};
    case 'not_in_manifest':case 'approval_required':case 'consent_required':return{msg:'Gmail is not allowed for this page yet.',allow:true};
    case 'selection_required':return{msg:'You have more than one Gmail connection. Pick one in the prompt claude.ai shows, then try again.'};
    case 'blocked_by_policy':return{msg:'Your organization blocks this Gmail action.'};
    case 'server_unavailable':return{msg:'Gmail did not respond. Try again in a moment.',retry:true};
    case 'tool_error':return{msg:'Gmail reported a problem: '+String(e.message||'').slice(0,160),retry:true};
    default:return{msg:'Could not reach Gmail. Try again.',retry:true};
  }
}
async function gmail(tool,input,opts){

function mdFull(src){
  const lines=String(src||'').split('\n');let out='',list=null,code=false,codeBuf=[];
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\[\[([^\]]+)\]\]/g,(m,t)=>`<button class="wl-link" data-act="note-wiki" data-t="${t}">${t}</button>`);
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  lines.forEach((raw,i)=>{
    if(/^```/.test(raw.trim())){if(code){out+=`<pre class="nb-code">${esc(codeBuf.join('\n'))}</pre>`;codeBuf=[];code=false}else{close();code=true}return}
    if(code){codeBuf.push(raw);return}
    const l=raw.trimEnd();let m;
    if((m=l.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))){if(list!=='ul'){close();out+='<ul class="checks">';list='ul'}out+=`<li><input type="checkbox" data-ncheck="${i}" id="nc-${i}" ${m[1]!==' '?'checked':''}><label for="nc-${i}" class="${m[1]!==' '?'done':''}">${inline(m[2])}</label></li>`;return}
    if((m=l.match(/^\s*[-*] (.*)$/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`;return}
    if((m=l.match(/^\s*\d+[.)] (.*)$/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`;return}
    close();
    if((m=l.match(/^(#{1,3}) (.*)$/))){const n=m[1].length+1;out+=`<h${n}>${inline(m[2])}</h${n}>`;return}
    if(/^---+$/.test(l)){out+='<hr>';return}
    if((m=l.match(/^> ?(.*)$/))){out+=`<blockquote>${inline(m[1])}</blockquote>`;return}
    if(l.trim())out+=`<p>${inline(l)}</p>`;
  });
  if(code)out+=`<pre class="nb-code">${esc(codeBuf.join('\n'))}</pre>`;close();return out||'<p class="empty-note">Nothing written yet.</p>';
}
function notesList(){

function fmtNote(k){
  const ta=$('#ne-body');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  const lineStart=v.lastIndexOf('\n',s-1)+1;let ins,cur;
  const wrap=(a,b,ph)=>{const t=sel||ph;ins=v.slice(0,s)+a+t+b+v.slice(e);cur=[s+a.length,s+a.length+t.length]};
  const prefix=p=>{ins=v.slice(0,lineStart)+p+v.slice(lineStart);cur=[s+p.length,e+p.length]};
  switch(k){case 'b':wrap('**','**','bold');break;case 'i':wrap('*','*','italic');break;case 'code':sel.includes('\n')?wrap('```\n','\n```','code'):wrap('`','`','code');break;
    case 'link':wrap('[',`](https://)`,'link text');break;case 'wiki':wrap('[[',']]','Note title');break;
    case 'h':prefix('## ');break;case 'ul':prefix('- ');break;case 'ol':prefix('1. ');break;case 'cb':prefix('- [ ] ');break;case 'q':prefix('> ');break;
    case 'hr':ins=v.slice(0,e)+'\n\n---\n'+v.slice(e);cur=[e+6,e+6];break;case 'date':ins=v.slice(0,s)+today()+v.slice(e);cur=[s+10,s+10];break;}
  ta.value=ins;ta.focus();ta.setSelectionRange(cur[0],cur[1]);ta.dispatchEvent(new Event('input',{bubbles:true}));
}
async function noteAI(kind,id){
  const n=S.col.notes[id];if(!n)return;
  if(!AI){toast(S.aiOff||'The agent works when this page is open in Claude.');return}
  S.noteAI={id,kind,busy:true};renderMain();
  const body=`TITLE: ${n.title}\n\n${(n.body||'').slice(0,30000)}`;
  try{
    if(kind==='tasks'){
      const r=await AI.json(`Extract concrete action items from this note as tasks for a freelancer's project plan. Reply with only a JSON array of {"title": string, "hours": number (most likely estimate), "notes": string}. Empty array if none.\n\n${body}`,{modelTier:'quick'});
      S.noteAI={id,kind,busy:false,tasks:(Array.isArray(r)?r:[]).filter(t=>t&&t.title).slice(0,30)};
    }else{
      const ask={summary:'Summarize this note in 3-6 short bullets, then one line with the most important next step. Markdown bullets only.',
        tidy:'Rewrite this note so it is clear and well structured. Keep every fact, decision and action item, keep checklists as "- [ ]", use ## headings. Return only the rewritten note body in markdown.',
        expand:'Expand these notes into a complete, well-structured draft document (markdown with ## headings). Keep the author\'s facts; mark assumptions with (assumption). Return only the document body.'}[kind];
      const r=await AI(`${ask}\n\n${body}`,{modelTier:kind==='summary'?'quick':'default',cache:false});
      S.noteAI={id,kind,busy:false,text:r.text};
    }
  }catch(e){const c=e&&e.code;S.noteAI={id,kind,busy:false,err:c==='not_granted'||c==='sampling_disabled'?'The agent is turned off for this page.':c==='rate_limited'?'Too many requests just now. Try again in a minute.':c==='invalid_json'?'The agent did not return a task list. Try again.':'The agent could not finish. Try again.'}}
  renderMain();
}

function buildReport(){

      rows.sort((a,b)=>a[0].localeCompare(b[0]));const byP={};rows.forEach(x=>byP[x[1]]=(byP[x[1]]||0)+num(x[5]));chart=Object.entries(byP).map(([k,v])=>[k,r1(v),'h']);
      sum=[['Hours',fmtH(rows.reduce((a,x)=>a+num(x[5]),0))],['Billable',fmtH(rows.filter(x=>x[6]==='yes').reduce((a,x)=>a+num(x[5]),0))],['Entries',rows.length],['Value',rows.reduce((a,x)=>a+num(x[7]),0).toLocaleString()]];break;

      for(const p of ps)for(const i of p.invoices.filter(i=>inRange(i.date)))rows.push([pn(p),i.number,i.date,i.hours,i.rate,i.total,p.currency,i.status]);
      for(const p of ps){const h=p.time.filter(e=>e.billable!==false&&!e.invoiced).reduce((a,e)=>a+num(e.hours),0);if(h)rows.push([pn(p),'(not invoiced)','',r1(h),p.rate,Math.round(h*num(p.rate)),p.currency,'ready to invoice'])}
      chart=[['Paid',rows.filter(x=>x[7]==='paid').reduce((a,x)=>a+num(x[5]),0),''],['Sent',rows.filter(x=>x[7]==='sent').reduce((a,x)=>a+num(x[5]),0),''],['Draft',rows.filter(x=>x[7]==='draft').reduce((a,x)=>a+num(x[5]),0),''],['Not invoiced',rows.filter(x=>x[7]==='ready to invoice').reduce((a,x)=>a+num(x[5]),0),'']];
      sum=chart.map(([l,v])=>[l,Math.round(v).toLocaleString()]);break;
    case 'milestones':cols=['Project','Milestone','Due','Done','Tasks done','Late'];
      for(const p of ps)for(const m of p.milestones){const ts=p.tasks.filter(t=>t.milestone===m.id);rows.push([pn(p),m.title,m.due||'',m.done?'yes':'',`${ts.filter(isDone).length}/${ts.length}`,!m.done&&isISO(m.due)&&m.due<today()?'yes':''])}
      rows.sort((a,b)=>(a[2]||'9').localeCompare(b[2]||'9'));sum=[['Milestones',rows.length],['Reached',rows.filter(x=>x[3]).length],['Late',rows.filter(x=>x[5]).length]];break;
    case 'requests':cols=['Project','ID','Received','From','Status','Impact','Linked tasks','Request'];
      for(const p of ps)for(const q of p.requests.filter(q=>inRange(q.date)))rows.push([pn(p),q.id,q.date,q.from||'',q.status,q.impact||'',p.tasks.filter(t=>t.request===q.id).length,q.text.slice(0,300)]);
      sum=[['Requests',rows.length],['Change orders',rows.filter(x=>x[5]==='change-order').length],['Open',rows.filter(x=>x[4]==='new').length]];break;
    case 'workload':{cols=['Person','Capacity (h/wk)'];const w0=weekStart(today());const weeks=[0,1,2,3].map(i=>addDays(w0,i*7));cols.push(...weeks.map(w=>'Week of '+w));
      const load={};S.ws.people.forEach(x=>load[x.id]=[0,0,0,0]);
      for(const p of ps){const sch=schedule(p),lg=loggedMap(p);for(const t of p.tasks){if(isDone(t)||!t.assignees.length)continue;const rem=Math.max(0,pert(t).E-(lg[t.id]||0));if(!rem)continue;const when=isISO(t.due)?t.due:addDays(sch.base,sch.map[t.id].ef-1);let wi=Math.floor(dIdx(weekStart(when<today()?today():when),w0)/7);if(wi<0)wi=0;if(wi>3)continue;for(const a of t.assignees)if(load[a])load[a][wi]+=rem/t.assignees.length}}
      for(const x of S.ws.people)rows.push([x.name,x.capacity,...load[x.id].map(r1)]);sum=[['People',rows.length]];break}
  }
  const title=(REPORTS.find(x=>x[0]===r.type)||[])[1]+(r.pid==='all'?' · all projects':' · '+(S.projects[r.pid]||{}).name);
  return{title,cols,rows,sum,chart,range:['time','billing','requests'].includes(r.type)?`${r.from} to ${r.to}`:''};
}

function reportFile(fmt){
  const rep=buildReport();const stamp=today();const base=('workbench-'+S.report.type+'-'+stamp).replace(/[^a-z0-9-]/gi,'-');
  if(fmt==='csv'){const cell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};return[base+'.csv','﻿'+[rep.cols,...rep.rows].map(r=>r.map(cell).join(',')).join('\r\n')]}
  const mdCell=v=>String(v??'').replace(/\|/g,'\\|').replace(/\n/g,' ');
  if(fmt==='md')return[base+'.md',`# ${rep.title}\n\n${rep.range?'_'+rep.range+'_\n\n':''}${rep.sum.map(([k,v])=>`- **${k}:** ${v}`).join('\n')}\n\n| ${rep.cols.map(mdCell).join(' | ')} |\n| ${rep.cols.map(()=>'---').join(' | ')} |\n${rep.rows.map(r=>'| '+r.map(mdCell).join(' | ')+' |').join('\n')}\n${S.report.summary&&S.report.summary.text?'\n## Analysis\n\n'+S.report.summary.text+'\n':''}\n_Generated ${stamp} by Workbench_\n`];
  const e=s=>esc(s);
  return[base+'.html',`<!doctype html><html><head><meta charset="utf-8"><title>${e(rep.title)}</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#16201C;margin:32px;max-width:1100px}h1{font-size:22px;margin:0 0 4px}.sub{color:#5B6863;margin-bottom:18px}.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.kpi{border:1px solid #D8DED9;border-radius:8px;padding:10px 14px}.kpi b{display:block;font-size:20px}table{border-collapse:collapse;width:100%;font-size:12.5px}th{background:#F5F7F6;text-align:left}th,td{border-bottom:1px solid #E6EAE7;padding:6px 8px}.an{background:#F2F1FD;border-radius:8px;padding:12px 16px;margin-bottom:18px;white-space:pre-wrap}</style></head><body><h1>${e(rep.title)}</h1><div class="sub">${rep.range?e(rep.range)+' · ':''}Generated ${stamp}</div><div class="kpis">${rep.sum.map(([k,v])=>`<div class="kpi">${e(k)}<b>${e(v)}</b></div>`).join('')}</div>${S.report.summary&&S.report.summary.text?`<div class="an">${e(S.report.summary.text)}</div>`:''}<table><thead><tr>${rep.cols.map(c=>`<th>${e(c)}</th>`).join('')}</tr></thead><tbody>${rep.rows.map(r=>`<tr>${r.map(v=>`<td>${e(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`];
}

  'inbox-q':(f,fd)=>{S.inbox.q=(fd.q||'').trim()||'in:inbox';loadInbox()},
  'note-folder':(f,fd)=>{const nm=(fd.name||'').trim();if(!nm)return;commitWs(ws=>{ws.noteFolders=[...new Set([...(ws.noteFolders||['Work','Personal','Ideas']),nm])]},'none');S.noteFolder='folder:'+nm;renderMain()},
  'contact':(f,fd)=>{const id=f.dataset.id||uid();const ex=S.col.contacts[id]||{created:Date.now(),source:'manual'};
    saveDoc('contacts',Object.assign(ex,{id,name:(fd.name||'').trim(),email:(fd.email||'').trim().toLowerCase(),phone:fd.phone||'',company:fd.company||'',role:fd.role||'',tags:String(fd.tags||'').split(',').map(s=>s.trim()).filter(Boolean),notes:fd.notes||'',projects:[...f.querySelectorAll('[name=proj]:checked')].map(x=>x.value)}),'none');S.modal=null;render()},
  'lib':async(f,fd)=>{
    const id=f.dataset.id||uid();const ex=S.col.library[id]||{created:Date.now()};const file=f.querySelector('#lb-file')?.files?.[0];
    const doc=Object.assign(ex,{id,type:fd.type,title:(fd.title||'').trim(),creator:fd.creator||'',url:(fd.url||'').trim(),status:fd.status,progress:Math.max(0,Math.min(100,num(fd.progress))),rating:Math.max(0,Math.min(5,num(fd.rating))),tags:String(fd.tags||'').split(',').map(s=>s.trim()).filter(Boolean),project:fd.project||'',notes:fd.notes||''});
    if(file&&ASSETS){const btn=f.querySelector('button.primary');if(btn){btn.disabled=true;btn.textContent='Uploading…'}
      try{const ext=(file.name.split('.').pop()||'').toLowerCase();const map={csv:'text/csv',md:'text/markdown',json:'application/json',txt:'text/plain'};
        const up=await ASSETS.upload(file,map[ext]?{type:map[ext]}:(file.type?undefined:{type:'application/pdf'}));
        if(ex.assetId&&ex.assetId!==up.id){try{await ASSETS.delete(ex.assetId)}catch(e){}}
        doc.assetId=up.id;doc.contentType=up.contentType;doc.fileName=file.name;if(!doc.title)doc.title=file.name}
      catch(e){const c=e&&e.code;toast(c==='too_large'?'That file is too large (20 MB max, 2 MB for SVG).':c==='unsupported_type'?'That file type cannot be stored. Use PDF, images, video, CSV, Markdown, JSON or text.':c==='quota_or_state'?'Library storage is full.':'Upload failed. Try again.');if(btn){btn.disabled=false;btn.textContent='Save'}return}}
    if(!doc.title){toast('Add a title or a file');return}
    saveDoc('library',doc,'none');S.modal=null;render()}
};
function extModal(m){
  if(m.type==='account')return`<h2>Account</h2>${accountCard()}<div class="modal-actions"><button class="btn" data-act="close-modal">Done</button></div>`;
  if(m.type==='contact'){const c=S.col.contacts[m.id]||{};
    return`<h2>${m.id?'Edit contact':'New contact'}</h2><form class="form" data-form="contact" ${m.id?`data-id="${m.id}"`:''}><div class="two"><label>Name<input id="ct-name" name="name" value="${esc(c.name||'')}" required></label><label>Email<input id="ct-email" name="email" type="email" value="${esc(c.email||'')}"></label></div>
      <div class="three"><label>Phone<input id="ct-phone" name="phone" value="${esc(c.phone||'')}"></label><label>Company<input id="ct-co" name="company" value="${esc(c.company||'')}"></label><label>Role<input id="ct-role" name="role" value="${esc(c.role||'')}"></label></div>
      <label>Tags<input id="ct-tags" name="tags" value="${esc((c.tags||[]).join(', '))}" placeholder="client, decision-maker"></label>
      <label>Projects<div class="toggle-chips">${Object.values(S.projects).map(p=>`<label class="tchip ${(c.projects||[]).includes(p.id)?'on':''}" style="padding:3px 9px"><input type="checkbox" name="proj" value="${p.id}" ${(c.projects||[]).includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')||'<span class="empty-note">No projects yet</span>'}</div></label>
      <label>Notes<textarea id="ct-notes" name="notes">${esc(c.notes||'')}</textarea></label>
      <div class="modal-actions">${m.id?`<button type="button" class="btn danger" data-act="confirm-ct" data-id="${m.id}" style="margin-right:auto">Delete</button>`:''}<button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary">Save</button></div></form>`}
  if(m.type==='lib'){const x=S.col.library[m.id]||{type:S.libType!=='all'?S.libType:'book',status:'todo',rating:0};
    return`<h2>${m.id?'Edit material':'Add material'}</h2><form class="form" data-form="lib" ${m.id?`data-id="${m.id}"`:''}>
      <div class="two"><label>Type<select id="lb-type" name="type">${opts(LIB_TYPES,x.type)}</select></label><label>Status<select id="lb-st" name="status">${opts(LIB_STATUS,x.status)}</select></label></div>
      <label>Title<input id="lb-title" name="title" value="${esc(x.title||'')}" placeholder="Thinking in Systems"></label>
      <div class="two"><label>Author / creator<input id="lb-cr" name="creator" value="${esc(x.creator||'')}"></label><label>Link<input id="lb-url" name="url" type="url" value="${esc(x.url||'')}" placeholder="https://"></label></div>
      ${ASSETS?`<label>File (PDF, image, video, CSV, Markdown, text · up to 20 MB)<input id="lb-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.webm,.csv,.md,.json,.txt">${x.fileName?`<span class="tid">Current file: ${esc(x.fileName)}</span>`:''}</label>`:'<p class="empty-note" style="margin:0">File uploads are available to the artifact’s owner in Claude. You can still save a link.</p>'}
      <div class="three"><label>Progress %<input id="lb-pg" name="progress" type="number" min="0" max="100" value="${num(x.progress)}"></label><label>Rating (0–5)<input id="lb-rt" name="rating" type="number" min="0" max="5" value="${num(x.rating)}"></label><label>Project<select id="lb-pj" name="project"><option value="">None</option>${opts(Object.values(S.projects).map(p=>[p.id,p.name]),x.project||'')}</select></label></div>
      <label>Tags<input id="lb-tags" name="tags" value="${esc((x.tags||[]).join(', '))}" placeholder="training, facilitation"></label>
      <label>Notes<textarea id="lb-notes" name="notes" placeholder="Why it matters, key takeaways, where you'll use it">${esc(x.notes||'')}</textarea></label>
      <div class="modal-actions">${m.id?`<button type="button" class="btn danger" data-act="lib-del" data-id="${m.id}" style="margin-right:auto">Delete</button>`:''}<button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary">Save</button></div></form>`}
  return'';
}
EXT['confirm-ct']=el=>confirmAsk('Delete contact?','The contact is removed from Workbench. Gmail is not changed.','ct-del',el.dataset.id);
EXTC['ct-del']=m=>{delDoc('contacts',m.id)};

/* ============ boot ============ */
async function init(){
  loadLocal();Object.values(S.projects).forEach(ensureProject);normalizeCur();
  if(S.page==='project'&&!S.cur)S.page='dashboard';
  render();
  if(!window.claude||!window.claude.use){S.aiOff='The agent works when this page is open in Claude.';renderAI();return}
  const use=n=>window.claude.use(n).catch(()=>null);
  const [db,sample,mcp,dl,usr,assets,perms]=await Promise.all([use('db'),use('sample'),use('mcp'),use('downloads'),use('user'),use('assets'),use('permissions')]);
  AI=sample||null;if(!AI)S.aiOff='The agent is not available in this view.';
  MCP=mcp;DL=dl;USER=usr;ASSETS=assets;PERMS=perms;
  if(USER){try{ME=await USER.me()}catch(e){}}
  if(db){DB=db;S.mode='db';subscribe();subscribeCols()}
  let seen=false;try{seen=sessionStorage.getItem('fw.in')==='1'}catch(e){}
  S.welcome=!seen;
  await refreshGmailStatus();
  render();
  if(S.page==='inbox'&&MCP)loadInbox();
}
init();
</script>
